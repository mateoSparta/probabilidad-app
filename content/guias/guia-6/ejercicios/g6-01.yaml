id: g6-01
guia: 6
numero: "6.1"
prioridad: recomendado
fuente:
  enunciado: fuentes/guias/parte1.pdf#p36

enunciado: |
  Una empresa produce discos que son defectuosos con probabilidad $0{,}01$ y
  los vende en paquetes de 10. [[bernoulli-binomial|Ofrece una garantía de que
  como máximo 1 de los 10 discos del paquete es defectuoso]], en caso contrario
  devolverá el dinero de la compra.

items:
  - id: a
    pregunta: ¿Qué proporción de los paquetes no satisface la garantía?
    skills: [bernoulli-binomial]
    respuesta:
      tipo: numerica
      valor: "1 - 0.99^10 - 10*0.01*0.99^9"
    pistas:
      - '¿Cuántos discos defectuosos admite la garantía? ¿Cuándo se incumple?'
      - Conviene calcular el complemento, que corresponde a los paquetes con 0 o 1 discos defectuosos.
      - >-
        Plan: $X \sim \text{Bin}(10;\ 0{,}01)$ y se pide $P(X \ge 2)$. Calculá
        $1 - P(X=0) - P(X=1)$. El resultado es aproximadamente $0{,}0043$,
        mucho menor que la probabilidad $0{,}01$ de que un disco sea
        defectuoso.
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g6_01.py
          valor: "0.004266"

  - id: b
    pregunta: >-
      Si Lucas compra tres paquetes, ¿cuál es la probabilidad de que le
      devuelvan el dinero de la compra de exactamente uno de ellos?
    skills: [bernoulli-binomial]
    respuesta:
      tipo: numerica
      valor: "3*(1 - 0.99^10 - 10*0.01*0.99^9)*(0.99^10 + 10*0.01*0.99^9)^2"
      tol_rel: 0.005
    pistas:
      - Ahora los ensayos son los paquetes.
      - '¿Con qué probabilidad un paquete incumple la garantía? Ese valor ya lo calculaste.'
      - >-
        Plan: usá otra binomial, con 3 ensayos y la probabilidad del ítem (a).
        Usar $0{,}01$ es incorrecto, porque esa es la probabilidad de que falle
        un **disco**, y conduce a un resultado de más del doble del correcto.
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g6_01.py
          valor: "0.012690"
        - origen: "tools/verify/g6_01.py (error de la resuelta, ver PLAN.md §7: usar p=0.01 da 0.029403)"
          valor: "0.029403"
