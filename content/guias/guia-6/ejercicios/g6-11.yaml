id: g6-11
guia: 6
numero: "6.11"
prioridad: recomendado
fuente:
  enunciado: fuentes/guias/parte1.pdf#p38

enunciado: |
  Un dado equilibrado tiene pintadas sus seis caras de la siguiente forma:
  [[geometrica-pascal|rojo, amarillo, amarillo, verde, verde, verde]].

items:
  - id: a
    pregunta: >-
      Calcular [[esperanza|la esperanza de la cantidad de lanzamientos]] del
      dado que deberán realizarse
      [[inclusion-exclusion|para observar sus tres colores]].
    skills: [geometrica-pascal, esperanza, inclusion-exclusion]
    respuesta:
      tipo: numerica
      valor: "73/10"
      tol_rel: 0.002
    pistas:
      - >-
        Los tres colores **no** son equiprobables, ya que salen con
        probabilidades $1/6$, $2/6$ y $3/6$. Por eso no se aplica la fórmula
        del coleccionista con probabilidades iguales.
      - >-
        Para una variable que toma valores enteros positivos vale
        $E[T] = \sum_{t \ge 0} P(T > t)$. ¿Qué significa $T > t$?
      - >-
        Plan: $T > t$ significa que después de $t$ lanzamientos falta algún
        color. Calculá esa probabilidad por inclusión-exclusión sobre los tres
        colores, de modo que cada término da una serie geométrica. **Incluí el
        término correspondiente a los tres colores**, que aporta 1; omitirlo
        conduce a $6{,}3$ en lugar de $7{,}3$.
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g6_11.py
          valor: "73/10"
