id: g6-19
guia: 6
numero: "6.19"
prioridad: recomendado
fuente:
  enunciado: fuentes/guias/parte1.pdf#p40

enunciado: |
  Un motoquero transita por una avenida.
  [[condicional|Las probabilidades de que al momento de llegar a un semáforo
  este se encuentre en rojo, amarillo o verde son $0{,}45$, $0{,}05$ y $0{,}5$
  respectivamente.]] Los estados de los semáforos son independientes y
  [[geometrica-pascal|el motoquero sólo se detiene al encontrar un semáforo en
  rojo]]. Sea $N$ la cantidad de luces verdes que atravesó hasta detenerse.

items:
  - id: a
    pregunta: >-
      Hallar la función de probabilidad de $N$ y evaluarla donde se pide.
    skills: [geometrica-pascal, condicional]
    respuesta:
      tipo: checkpoints
      checkpoints:
        - pregunta: '$P(N = 0)$'
          valor: "9/19"
        - pregunta: '$P(N = 1)$'
          valor: "90/361"
        - pregunta: '$P(N = 3)$'
          valor: "9000/130321"
    pistas:
      - '¿Cómo cambia $N$ cuando el motoquero encuentra un semáforo en amarillo?'
      - >-
        El amarillo no lo detiene ni se suma a $N$, de modo que para este
        cálculo ese semáforo puede ignorarse.
      - >-
        Plan: considerá solo los semáforos en rojo o en verde. Entre ellos, la
        probabilidad de verde es $0{,}5/0{,}95 = 10/19$, y con ese valor $N$
        tiene distribución geométrica. Usar directamente $0{,}5$ es el error
        más frecuente en este ejercicio.
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g6_19.py
          valor: "9/19, 90/361, 9000/130321"
        - origen: "tools/verify/g6_19.py (control: la funcion de probabilidad suma 1)"
          valor: "1"

  - id: b
    pregunta: 'Calcular $P(N > 2)$.'
    skills: [geometrica-pascal]
    respuesta:
      tipo: numerica
      valor: "1000/6859"
    pistas:
      - 'El evento $N > 2$ significa que los tres primeros semáforos relevantes estaban en verde.'
      - 'Plan: $(10/19)^3$. El valor $0{,}5^3 = 1/8$ no tiene en cuenta los semáforos en amarillo.'
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g6_19.py
          valor: "1000/6859"
        - origen: "tools/verify/g6_19.py (error tipico: 0.5^3 = 1/8)"
          valor: "1/8"
