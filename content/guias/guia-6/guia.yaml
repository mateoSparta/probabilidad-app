numero: 6
titulo: Distribuciones discretas
descripcion: >-
  Los modelos discretos de uso más frecuente. La binomial, cuando se fija la
  cantidad de ensayos; la multinomial, cuando cada ensayo admite más de dos
  resultados; la geométrica y la de Pascal, cuando se fija la
  cantidad de éxitos; la hipergeométrica, cuando las extracciones son sin
  reposición; y la pérdida de memoria, propiedad que distingue a la
  geométrica y a la exponencial de todas las demás distribuciones.

secuencia:
