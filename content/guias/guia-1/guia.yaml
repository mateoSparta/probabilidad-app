numero: 1
titulo: Espacios de probabilidad
descripcion: >-
  Qué es un experimento aleatorio, cómo se arma el espacio muestral y qué
  familias de eventos admiten una probabilidad coherente. De ahí salen las
  herramientas que se usan en todo lo que sigue: contar casos equiprobables,
  manejar uniones y complementos, multiplicar cuando hay independencia y pasar
  al límite cuando hay infinitos eventos.

# La secuencia alterna teoría y ejercicios (PLAN.md §4.5). El orden importa:
# cada bloque de teoría habilita los ejercicios que vienen después.
secuencia:
  - teoria: t-algebras
  - ejercicio: g1-01

  - teoria: t-prob-discreta
  - ejercicio: g1-03
  - ejercicio: g1-02

  - teoria: t-laplace
  - ejercicio: g1-04

  - teoria: t-independencia
  - ejercicio: g1-05

  - teoria: t-continuidad
  - ejercicio: g1-07
