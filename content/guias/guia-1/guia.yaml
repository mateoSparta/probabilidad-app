numero: 1
titulo: Espacios de probabilidad
descripcion: >-
  Qué es un experimento aleatorio, cómo se arma el espacio muestral y qué
  familias de eventos admiten una probabilidad coherente. De ahí salen las
  herramientas que se usan en todo lo que sigue: contar casos equiprobables,
  manejar uniones y complementos, multiplicar cuando hay independencia,
  condicionar, invertir un condicional con Bayes y pasar al límite cuando hay
  infinitos eventos.

# La secuencia alterna teoría y ejercicios (PLAN.md §4.5). El orden importa:
# cada bloque de teoría habilita los ejercicios que vienen después, y los
# ejercicios están ordenados de más mecánico a más conceptual dentro de
# cada tema.
