id: g1-05
guia: 1
numero: "1.5"
fuente:
  enunciado: fuentes/guias/parte1.pdf#p3

enunciado: |
  Se tienen dos urnas $a$ y $b$. [[laplace|En $a$ hay 5 bolas rojas y 3
  blancas, y en $b$ hay 2 rojas y 3 blancas.]]
  [[independencia|Si se extraen al azar una bola de cada urna]], hallar la
  probabilidad de que

items:
  - id: a
    pregunta: ambas sean rojas.
    skills: [laplace, independencia]
    respuesta:
      tipo: numerica
      valor: "1/4"
    pistas:
      - Las dos extracciones se hacen en urnas distintas, de modo que una no afecta a la otra.
      - ¿Cuál es la probabilidad de extraer una bola roja de cada urna por separado?
      - 'Plan: multiplicá las dos probabilidades.'
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g1_05.py
          valor: "1/4"

  - id: b
    pregunta: ambas sean del mismo color.
    skills: [laplace, independencia]
    respuesta:
      tipo: numerica
      valor: "19/40"
    pistas:
      - 'El evento "del mismo color" se descompone en dos casos incompatibles.'
      - Calculá cada caso por separado con la regla del producto y sumalos.
      - 'Plan: $P(\text{ambas rojas}) + P(\text{ambas blancas})$.'
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g1_05.py
          valor: "19/40"

  - id: c
    pregunta: sean de distinto color.
    skills: [independencia]
    respuesta:
      tipo: numerica
      valor: "21/40"
    pistas:
      - Es el complemento del ítem anterior.
      - 'Plan: $1 - P(\text{mismo color})$.'
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g1_05.py
          valor: "21/40"

  - id: d
    pregunta: la bola extraída de la urna $b$ sea blanca.
    skills: [laplace]
    respuesta:
      tipo: numerica
      valor: "3/5"
    pistas:
      - El resultado de la urna $a$ no influye en este evento.
      - 'Plan: aplicá la regla de Laplace a la composición de la urna $b$.'
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g1_05.py
          valor: "3/5"
