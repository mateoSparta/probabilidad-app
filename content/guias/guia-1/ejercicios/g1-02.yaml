id: g1-02
guia: 1
numero: "1.2"
fuente:
  enunciado: fuentes/guias/parte1.pdf#p3

enunciado: |
  [DeGroot, pp. 38-42] En un grupo de 200 estudiantes de Ingeniería Industrial,
  137 cursan Álgebra II, 60 Probabilidad y 124 Materiales Industriales.
  [[inclusion-exclusion|Además, 33 cursan Álgebra II y Probabilidad; 29 Probabilidad y Materiales Industriales; y 92 Álgebra II y Materiales Industriales. Finalmente, 18 cursan las tres materias.]]
  Se elige un estudiante al azar en ese grupo.

items:
  - id: a
    pregunta: Calcular la probabilidad de que curse Álgebra II o Probabilidad.
    skills: [inclusion-exclusion]
    respuesta:
      tipo: numerica
      valor: "41/50"
    pistas:
      - Los dos eventos tienen intersección no vacía, porque hay estudiantes que cursan ambas materias.
      - Si sumás los que cursan cada materia, los que cursan ambas quedan contados dos veces.
      - 'Plan: $P(A \cup B) = P(A) + P(B) - P(A \cap B)$, con los tres números del enunciado.'
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g1_02.py
          valor: "41/50"

  - id: b
    pregunta: Calcular la probabilidad de que no curse ni Álgebra II ni Probabilidad.
    skills: [inclusion-exclusion]
    respuesta:
      tipo: numerica
      valor: "9/50"
    pistas:
      - 'El evento "ni una ni la otra" es el complemento de un evento que ya calculaste.'
      - 'Plan: $P((A \cup B)^c) = 1 - P(A \cup B)$.'
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g1_02.py
          valor: "9/50"

  - id: c
    pregunta: Calcular la probabilidad de que curse alguna de las tres materias.
    skills: [inclusion-exclusion]
    respuesta:
      tipo: numerica
      valor: "37/40"
    pistas:
      - Con tres eventos hay que descontar las intersecciones de a pares.
      - Al descontar las tres intersecciones de a pares, los que cursan las tres materias quedan restados de más.
      - >-
        Plan: sumá las tres probabilidades, restá las tres intersecciones de a
        pares y sumá la intersección de las tres.
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g1_02.py
          valor: "37/40"

  - id: d
    pregunta: Calcular la probabilidad de que curse solo una de las tres materias.
    skills: [inclusion-exclusion]
    respuesta:
      tipo: numerica
      valor: "67/200"
    pistas:
      - 'El evento "solo Álgebra II" excluye a quienes además cursan alguna de las otras dos materias.'
      - >-
        Conviene completar el diagrama de Venn desde el centro hacia afuera,
        empezando por los 18 estudiantes que cursan las tres materias,
        siguiendo por las zonas de dos materias y terminando por las de una
        sola.
      - >-
        Plan: para cada materia, restá las dos intersecciones de a pares que la
        involucran y sumá la intersección de las tres. Después sumá las tres
        zonas obtenidas.
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g1_02.py
          valor: "67/200"

  - id: e
    pregunta: Calcular la probabilidad de que no curse ninguna de las tres materias.
    skills: [inclusion-exclusion]
    respuesta:
      tipo: numerica
      valor: "3/40"
    pistas:
      - Es el complemento de uno de los ítems anteriores.
      - 'Plan: $1 - P(A \cup B \cup C)$.'
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g1_02.py
          valor: "3/40"
