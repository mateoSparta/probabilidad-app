id: g1-01
guia: 1
numero: "1.1"
prioridad: recomendado
fuente:
  enunciado: fuentes/guias/parte1.pdf#p3

enunciado: |
  Sea $\Omega = \{1, 2, 3, 4, 5, 6\}$.

items:
  - id: a
    pregunta: >-
      ¿Cuál es la [[algebras|menor álgebra de subconjuntos de $\Omega$]] tal
      que $\{1, 2, 3\}$ pertenezca a ella?
    skills: [algebras]
    respuesta:
      tipo: opcion
      opciones:
        - id: a1
          texto: '$\{\emptyset,\ \{1,2,3\},\ \{4,5,6\},\ \Omega\}$'
          correcta: true
        - id: a2
          texto: '$\{\{1,2,3\},\ \{4,5,6\}\}$'
          error_tipico: >-
            Toda álgebra contiene a $\emptyset$ y a $\Omega$, y esta familia no
            incluye a ninguno de los dos.
        - id: a3
          texto: '$\{\emptyset,\ \{1,2,3\},\ \Omega\}$'
          error_tipico: >-
            Si $\{1,2,3\}$ pertenece al álgebra, su complemento $\{4,5,6\}$
            también tiene que pertenecer.
        - id: a4
          texto: 'Los $64$ subconjuntos de $\Omega$'
          error_tipico: >-
            Esa es la mayor álgebra de subconjuntos de $\Omega$. Se pide la
            menor que contenga a $\{1,2,3\}$.
    pistas:
      - ¿Qué tres condiciones tiene que cumplir una familia de subconjuntos para ser un álgebra?
      - Si $\{1,2,3\}$ pertenece, la condición del complemento obliga a incluir otro conjunto. ¿Cuál?
      - >-
        Plan: empezá por $\{1,2,3\}$, agregá su complemento, $\emptyset$ y
        $\Omega$, y verificá que las uniones entre esos conjuntos ya estén en
        la familia. Si no aparece ningún conjunto nuevo, esa es la menor
        álgebra.
    verificacion:
      estado: verificado
      metodo: exacto
      fuentes_valor:
        - origen: tools/verify/g1_01.py
          valor: "{∅, {1,2,3}, {4,5,6}, {1,2,3,4,5,6}}"

  - id: b
    pregunta: >-
      ¿Cuántos conjuntos tiene la [[algebras|menor álgebra de subconjuntos de
      $\Omega$]] tal que $\{1, 2\}$, $\{3, 4\}$ y $\{5, 6\}$ pertenezcan a ella?
    skills: [algebras]
    respuesta:
      tipo: opcion
      opciones:
        - id: b1
          texto: '$8$'
          correcta: true
        - id: b2
          texto: '$5$'
          error_tipico: >-
            Contaste los tres conjuntos dados más $\emptyset$ y $\Omega$, pero
            falta cerrar la familia por uniones. Por ejemplo,
            $\{1,2\} \cup \{3,4\}$ también tiene que pertenecer.
        - id: b3
          texto: '$6$'
          error_tipico: >-
            Faltan uniones. Entre los conjuntos dados hay tres uniones de a
            pares distintas.
        - id: b4
          texto: '$64$'
          error_tipico: >-
            Esa es la cantidad de subconjuntos de $\Omega$, que corresponde a
            la mayor álgebra. La menor álgebra que contiene a estos tres
            conjuntos tiene muchos menos elementos.
    pistas:
      - 'Los tres conjuntos dados son disjuntos y su unión es $\Omega$, de modo que forman una partición.'
      - ¿Qué conjuntos se obtienen al unir algunos de esos tres bloques?
      - >-
        Plan: cada conjunto del álgebra queda determinado por los bloques de la
        partición que incluye. Contá cuántas elecciones posibles hay.
    verificacion:
      estado: verificado
      metodo: exacto
      fuentes_valor:
        - origen: tools/verify/g1_01.py
          valor: "8"
