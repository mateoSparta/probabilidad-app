id: g1-13
guia: 1
numero: "1.13"
prioridad: recomendado
fuente:
  enunciado: fuentes/guias/parte1.pdf#p5

enunciado: |
  [[laplace|Una urna contiene 10 bolas numeradas del $0$ al $9$.]]

items:
  - id: a
    pregunta: >-
      Se extraen al azar [[conteo-muestras|con reposición]] cinco bolas.
      Calcular la probabilidad de que (1) las cinco sean iguales; (2) según el
      orden de extracción se observen los números $1,3,5,7,9$; (3) se observen
      los cinco números impares; (4) las cinco sean distintas.
    skills: [conteo-muestras, laplace]
    respuesta:
      tipo: checkpoints
      checkpoints:
        - pregunta: (1) las cinco iguales
          valor: "1/10000"
        - pregunta: (2) en ese orden
          valor: "1/100000"
        - pregunta: (3) los cinco impares
          valor: "3/2500"
        - pregunta: (4) las cinco distintas
          valor: "189/625"
    pistas:
      - Con reposición y teniendo en cuenta el orden, hay $10^5$ muestras posibles, todas equiprobables.
      - >-
        Los casos (2) y (3) difieren en el orden. En (2) el orden está fijado,
        mientras que en (3) sirve cualquier orden de los cinco números impares.
      - >-
        Plan: contá en cada caso cuántas de las $10^5$ muestras ordenadas
        cumplen la condición. En (3) son las permutaciones de cinco números; en
        (4), las muestras ordenadas sin repetición.
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g1_13.py
          valor: "1/10000, 1/100000, 3/2500, 189/625"

  - id: b
    pregunta: >-
      Calcular las probabilidades del inciso anterior, suponiendo que las
      extracciones se hacen [[conteo-muestras|sin reposición]].
    skills: [conteo-muestras, laplace]
    respuesta:
      tipo: checkpoints
      checkpoints:
        - pregunta: (1) las cinco iguales
          valor: "0"
        - pregunta: (2) en ese orden
          valor: "1/30240"
        - pregunta: (3) los cinco impares
          valor: "1/252"
        - pregunta: (4) las cinco distintas
          valor: "1"
    pistas:
      - Sin reposición, ¿cuántas muestras ordenadas de cinco bolas hay?
      - Dos de los cuatro casos se resuelven sin cálculos. Analizá si pueden ocurrir cuando no hay reposición.
      - >-
        Plan: el total es $10 \cdot 9 \cdot 8 \cdot 7 \cdot 6$. Contá los
        casos favorables de (2) y (3) como en el inciso anterior, y resolvé (1)
        y (4) observando qué es imposible y qué es seguro sin reposición.
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g1_13.py
          valor: "0, 1/30240, 1/252, 1"
