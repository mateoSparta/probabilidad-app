id: g1-13
guia: 1
numero: "1.13"
prioridad: recomendado
fuente:
  enunciado: fuentes/guias/parte1.pdf#p5

enunciado: |
  Una urna contiene 10 bolas numeradas del $0$ al $9$. Se extraen al azar
  cinco bolas. [[conteo-muestras|El mismo juego de preguntas se responde dos
  veces: una con reposición y otra sin reposición.]]

items:
  - id: a
    pregunta: >-
      **Con reposición.** Calcular la probabilidad de que
      (1) las cinco sean iguales; (2) según el orden de extracción se observen
      los números $1,3,5,7,9$; (3) se observen los cinco números impares, en
      cualquier orden; (4) las cinco sean distintas.
    skills: [conteo-muestras, laplace]
    respuesta:
      tipo: checkpoints
      checkpoints:
        - pregunta: (1) las cinco iguales
          valor: "1/10000"
        - pregunta: (2) en ese orden
          valor: "1/100000"
        - pregunta: (3) los cinco impares
          valor: "3/2500"
        - pregunta: (4) las cinco distintas
          valor: "189/625"
    pistas:
      - Con reposición y en orden, las muestras posibles son $10^5$ y todas igual de probables.
      - >-
        Ojo con la diferencia entre (2) y (3): en (2) el orden está fijado, en
        (3) cualquier orden de los cinco impares sirve.
      - >-
        Plan: contá en cada caso cuántas de las $10^5$ muestras ordenadas
        cumplen. Para (3) son las permutaciones de cinco números; para (4),
        las muestras ordenadas sin repetir.
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g1_13.py
          valor: "1/10000, 1/100000, 3/2500, 189/625"

  - id: b
    pregunta: >-
      **Sin reposición.** Calcular las mismas cuatro probabilidades.
    skills: [conteo-muestras, laplace]
    respuesta:
      tipo: checkpoints
      checkpoints:
        - pregunta: (1) las cinco iguales
          valor: "0"
        - pregunta: (2) en ese orden
          valor: "1/30240"
        - pregunta: (3) los cinco impares
          valor: "1/252"
        - pregunta: (4) las cinco distintas
          valor: "1"
    pistas:
      - Sin reposición, ¿cuántas muestras ordenadas de cinco bolas hay?
      - Dos de los cuatro casos no necesitan ninguna cuenta: pensá si pueden o no pasar.
      - >-
        Plan: el total es $10 \cdot 9 \cdot 8 \cdot 7 \cdot 6$. Contá los
        favorables de (2) y (3) igual que antes, y resolvé (1) y (4) por
        lo que sin reposición es imposible y lo que es seguro.
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g1_13.py
          valor: "0, 1/30240, 1/252, 1"
