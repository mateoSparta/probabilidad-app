id: g1-16
guia: 1
numero: "1.16"
prioridad: recomendado
fuente:
  enunciado: fuentes/guias/parte1.pdf#p6

enunciado: |
  Se colocarán 7 gatos en 5 cajas.
  [[ocupacion|Suponiendo que los gatos son indistinguibles y que todas las
  configuraciones distintas son equiprobables.]]

items:
  - id: a
    pregunta: >-
      Calcular la probabilidad de que la primera caja contenga exactamente dos
      gatos y la última caja quede vacía.
    skills: [ocupacion]
    respuesta:
      tipo: numerica
      valor: "7/110"
    pistas:
      - >-
        Como los gatos son indistinguibles, los casos equiprobables son las
        configuraciones $(n_1,\dots,n_5)$ con $\sum n_i = 7$.
      - '¿Cuántas configuraciones hay en total? Es la cantidad de soluciones enteras no negativas de $n_1 + \dots + n_5 = 7$.'
      - >-
        Plan: fijá $n_1 = 2$ y $n_5 = 0$, contá las configuraciones de los
        5 gatos restantes en las 3 cajas intermedias y dividí por el total.
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g1_16.py
          valor: "7/110"

  - id: b
    pregunta: Calcular la probabilidad de que la cuarta caja contenga más de 3 gatos.
    skills: [ocupacion]
    respuesta:
      tipo: numerica
      valor: "7/66"
    pistas:
      - 'Con 7 gatos en total, la condición "más de 3" deja pocos valores posibles para la cuarta caja.'
      - Para cada cantidad posible en la cuarta caja, los gatos restantes se reparten libremente en las otras cuatro.
      - >-
        Plan: para $k = 4, 5, 6, 7$ contá las configuraciones con $n_4 = k$,
        sumalas y dividí por el total de configuraciones.
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g1_16.py
          valor: "7/66"
