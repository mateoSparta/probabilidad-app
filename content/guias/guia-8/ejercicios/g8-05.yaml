id: g8-05
guia: 8
numero: "8.5"
prioridad: recomendado
fuente:
  enunciado: fuentes/guias/parte1.pdf#p48

enunciado: |
  Sean $X_1$, $X_2$ y $X_3$
  [[combinacion-normales|variables aleatorias independientes con distribución
  normal]] de [[normal|medias 1, 2 y 3 respectivamente, y varianzas $1/9$,
  $1/3$ y $1/2$ respectivamente]].

items:
  - id: a
    pregunta: 'Calcular $P\!\left(X_1 - \tfrac{1}{2} X_2 > 2 - \tfrac{1}{3} X_3\right)$.'
    skills: [combinacion-normales, normal]
    respuesta:
      tipo: numerica
      valor: "1/2 - erf(sqrt(2))/2"
    pistas:
      - 'Reordená la desigualdad para que el evento quede de la forma $Y > 0$.'
      - >-
        $Y$ es una combinación lineal de normales independientes, de modo que
        también es normal. Calculá su media y su varianza.
      - >-
        Plan: $Y = X_1 - \tfrac{1}{2}X_2 + \tfrac{1}{3}X_3 - 2$. En la media,
        los coeficientes intervienen sin modificación; en la varianza,
        intervienen **al cuadrado**, de modo que el signo desaparece. Se
        obtienen media $-1$ y varianza $1/4$, es decir, desvío $1/2$.
        Estandarizá y buscá en la tabla. Si la varianza resulta $4/9$, los
        coeficientes no se elevaron al cuadrado.
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g8_05.py
          valor: "1 - Phi(2) = 0.022750"
        - origen: "tools/verify/g8_05.py (controles: media -1, varianza 1/4; el error tipico de no elevar al cuadrado da 4/9)"
          valor: "1/4"
