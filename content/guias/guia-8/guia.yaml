numero: 8
titulo: Normal y teorema central del límite
descripcion: >-
  La distribución normal y la razón de su presencia en tantos modelos. La guía
  trata la estandarización para usar la tabla, la combinación lineal de
  normales independientes y el teorema central del límite, que permite
  aproximar la distribución de una suma de muchas variables sin conocer la
  distribución de cada una. Incluye además la corrección por continuidad,
  necesaria cuando la variable que se aproxima es discreta.

