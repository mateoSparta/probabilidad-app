numero: 3
titulo: Esperanza, varianza y covarianza
descripcion: >-
  Medidas que resumen una distribución en pocos números. La guía trata la
  esperanza y el error de aplicarla dentro de una función no lineal, la
  esperanza condicional a un evento, la varianza y la covarianza con sus
  propiedades, y las cotas que pueden establecerse cuando solo se conocen la
  media y la varianza.

