id: g3-08
guia: 3
numero: "3.8"
prioridad: recomendado
fuente:
  enunciado: fuentes/guias/parte1.pdf#p21

# Se cargan los incisos (a), (c) y (d). El (b) pide deducir una desigualdad,
# que es una demostración; su enunciado se cita en el ítem b porque el (c) lo
# usa.
enunciado: |
  Sea $Z$ una [[normal|variable normal estándar]], $\varphi$ su función de
  densidad, y sea $z_0 > 0$.

items:
  - id: a
    pregunta: >-
      Hallar la [[esperanza-condicional-evento|media de $Z \mid Z > z_0$]] (en
      función de $z_0$) y evaluarla donde se pide.
    skills: [esperanza-condicional-evento, normal]
    respuesta:
      tipo: checkpoints
      checkpoints:
        - pregunta: '$E[Z \mid Z > 1]$'
          valor: "exp(-1/2) / sqrt(2*pi) / (1/2 - erf(1/sqrt(2))/2)"
        - pregunta: '$E[Z \mid Z > 2]$'
          valor: "exp(-2) / sqrt(2*pi) / (1/2 - erf(2/sqrt(2))/2)"
    pistas:
      - >-
        $E[Z \mid Z > z_0]$ es la integral de $z\,\varphi(z)$ sobre
        $(z_0, \infty)$, dividida por $P(Z > z_0)$.
      - 'Observá que $\varphi^{\prime}(z) = -z\,\varphi(z)$, de modo que $z\,\varphi(z)$ tiene primitiva inmediata.'
      - >-
        Plan: integrá el numerador usando la primitiva $-\varphi$, dividí por
        $1 - \Phi(z_0)$ y evaluá con la tabla normal en $z_0 = 1$ y $z_0 = 2$.
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g3_08.py
          valor: "phi(1)/(1 - Phi(1)) = 1.5251, phi(2)/(1 - Phi(2)) = 2.3732"

  - id: b
    pregunta: >-
      Se puede deducir que $1 - \Phi(z_0) \le \dfrac{\varphi(z_0)}{z_0}$.
      Comparar la estimación que brinda esa cota para $P(Z > 3)$ con el valor
      tabulado.
    skills: [normal]
    respuesta:
      tipo: checkpoints
      checkpoints:
        - pregunta: 'La cota $\varphi(3)/3$'
          valor: "exp(-9/2) / sqrt(2*pi) / 3"
        - pregunta: 'El valor tabulado de $P(Z > 3)$'
          valor: "1/2 - erf(3/sqrt(2))/2"
    pistas:
      - 'La cota sale de evaluar $\varphi(z_0)/z_0$ en $z_0 = 3$.'
      - 'El valor tabulado es $1 - \Phi(3)$.'
      - >-
        Plan: calculá $\varphi(3) = e^{-9/2}/\sqrt{2\pi}$, dividilo por 3,
        buscá $\Phi(3)$ en la tabla y compará los dos números.
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g3_08.py
          valor: "0.001477 (cota), 0.001350 (tabla)"

  - id: c
    pregunta: >-
      Si $X = \sigma Z + \mu$ y $x_0 > \mu$, hallar la
      [[esperanza-condicional-evento|media de $X \mid X > x_0$]] en función de
      $x_0$, $\mu$ y $\sigma$, y evaluarla para
      $\mu = 10$, $\sigma = 2$ y $x_0 = 12$.
    skills: [esperanza-condicional-evento, normal]
    respuesta:
      tipo: numerica
      valor: "10 + 2 * exp(-1/2) / sqrt(2*pi) / (1/2 - erf(1/sqrt(2))/2)"
    pistas:
      - >-
        El evento $X > x_0$ es el mismo que
        $Z > (x_0 - \mu)/\sigma$.
      - Por linealidad, $E[\sigma Z + \mu \mid A] = \sigma E[Z \mid A] + \mu$ para cualquier evento $A$.
      - >-
        Plan: estandarizá el umbral, usá la fórmula del ítem (a) con ese
        $z_0$ y deshacé la estandarización.
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g3_08.py
          valor: "10 + 2 phi(1)/(1 - Phi(1)) = 13.0503"
