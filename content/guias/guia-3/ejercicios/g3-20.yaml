id: g3-20
guia: 3
numero: "3.20"
prioridad: recomendado
fuente:
  enunciado: fuentes/guias/parte1.pdf#p20

enunciado: |
  Sea $(X, Y)$ un vector aleatorio con
  [[conjunta-marginales|distribución uniforme sobre el triángulo de vértices
  $(0, 0)$, $(2, 2)$ y $(0, 2)$]].

items:
  - id: a
    pregunta: 'Calcular [[covarianza|$\operatorname{cov}(X, Y)$]].'
    skills: [covarianza, conjunta-marginales]
    respuesta:
      tipo: numerica
      valor: "1/9"
    pistas:
      - 'Describí el triángulo como región de integración. Para cada $x$, ¿entre qué valores varía $y$?'
      - 'Hacen falta tres esperanzas, $E[XY]$, $E[X]$ y $E[Y]$.'
      - >-
        Plan: el área del triángulo es 2, de modo que la densidad conjunta vale
        $1/2$ en su interior. Integrá con $y$ entre $x$ y $2$, y $x$ entre $0$
        y $2$, y aplicá $\operatorname{cov} = E[XY] - E[X]E[Y]$.
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g3_20.py
          valor: "1/9"
        - origen: "tools/verify/g3_20.py (controles: E[X]=2/3, E[Y]=4/3)"
          valor: "2/3, 4/3"

  - id: b
    pregunta: 'Calcular [[varianza,covarianza|$\operatorname{var}[X + Y]$]].'
    skills: [covarianza, varianza]
    respuesta:
      tipo: numerica
      valor: "2/3"
    pistas:
      - No hace falta volver a integrar si ya calculaste la covarianza.
      - La varianza de una suma incluye, además de las dos varianzas, un término cruzado.
      - >-
        Plan: $\operatorname{var}[X+Y] = \operatorname{var}[X] + \operatorname{var}[Y] + 2\operatorname{cov}(X,Y)$.
        Calculá las dos varianzas con $E[X^2] - E[X]^2$ y usá la covarianza del
        ítem anterior.
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g3_20.py
          valor: "2/3"
        - origen: "tools/verify/g3_20.py (control: coincide con integrar (X+Y)^2 directo)"
          valor: "2/3"

  - id: c
    pregunta: 'Calcular [[covarianza|$\operatorname{cov}(3X - Y + 2,\ X + Y)$]].'
    skills: [covarianza]
    respuesta:
      tipo: numerica
      valor: "2/3"
    pistas:
      - '¿Qué efecto tiene el $+2$ sobre la covarianza?'
      - La covarianza es lineal en cada argumento, de modo que se puede distribuir.
      - >-
        Plan: desarrollá usando la linealidad. Solo quedan
        $\operatorname{var}[X]$, $\operatorname{var}[Y]$ y
        $\operatorname{cov}(X,Y)$, que ya calculaste. La constante no
        contribuye.
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g3_20.py
          valor: "2/3"
        - origen: "tools/verify/g3_20.py (control: coincide con integrar directo)"
          valor: "2/3"
