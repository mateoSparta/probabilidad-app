id: g4-19
guia: 4
numero: "4.19"
prioridad: recomendado
fuente:
  enunciado: fuentes/guias/parte1.pdf#p26

enunciado: |
  La cantidad $L$ de langostas que arriban a la mesa de un asado tiene una
  distribución Poisson de media 2 y la cantidad $M$ de moscas tiene una
  distribución Poisson de media 8.
  [[suma-independientes|$L$ y $M$ son independientes.]]

items:
  - id: a
    pregunta: 'Hallar la función de probabilidad de $L + M$ y calcular $P(L + M = 10)$.'
    skills: [suma-independientes]
    respuesta:
      tipo: numerica
      valor: "10^10 * exp(-10) / 10!"
    pistas:
      - La suma de dos variables de Poisson independientes tiene distribución de Poisson.
      - '¿Cuál es su media? Analizá qué ocurre con las medias al sumar.'
      - >-
        Plan: $L + M \sim \text{Poisson}(2 + 8)$. Evaluá su función de
        probabilidad en 10. Para verificarlo, calculá la convolución
        $\sum_{j=0}^{10} P(L = j)\,P(M = 10 - j)$, que debe dar el mismo
        resultado.
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g4_19.py
          valor: "10^10 exp(-10)/10!"
        - origen: "tools/verify/g4_19.py (control: la convolucion da Poisson(10))"
          valor: "coincide"

  - id: b
    pregunta: >-
      Hallar la función de probabilidad de $M$
      [[condicional|dado que $L + M = 10$]], y evaluarla donde se pide.
    skills: [suma-independientes, condicional]
    respuesta:
      tipo: checkpoints
      checkpoints:
        - pregunta: '$P(M = 8 \mid L + M = 10)$'
          valor: "589824/1953125"
        - pregunta: '$P(M = 10 \mid L + M = 10)$'
          valor: "1048576/9765625"
        - pregunta: '$P(M = 0 \mid L + M = 10)$'
          valor: "1/9765625"
    pistas:
      - >-
        Escribí la definición de probabilidad condicional y usá que el evento
        $\{M = k, L+M = 10\}$ coincide con $\{M = k, L = 10 - k\}$.
      - >-
        Al simplificar, las exponenciales se cancelan y el resultado depende
        solo de la proporción entre las medias.
      - >-
        Plan: el resultado es una binomial con 10 ensayos y probabilidad de
        éxito $8/(2+8)$. Equivale a que cada uno de los 10 insectos sea una
        mosca, de manera independiente, con esa probabilidad.
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g4_19.py
          valor: "Bin(10, 4/5): 589824/1953125, 1048576/9765625, 1/9765625"

  - id: c
    pregunta: 'Calcular [[condicional|$P(M > 2 \mid L + M = 10)$]].'
    skills: [suma-independientes, condicional]
    respuesta:
      tipo: numerica
      valor: "9764864/9765625"
      tol_rel: 0.0005
    pistas:
      - Usá la distribución condicional del ítem anterior.
      - 'El complemento tiene solo tres términos, $M = 0$, $1$ y $2$.'
      - >-
        Plan: calculá $1 - P(M \le 2)$ con la binomial. El resultado es muy
        cercano a 1, porque con 10 insectos y probabilidad $0{,}8$ de que cada
        uno sea mosca, observar 2 moscas o menos es muy improbable.
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g4_19.py
          valor: "9764864/9765625"
