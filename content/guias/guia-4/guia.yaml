numero: 4
titulo: Transformaciones de variables aleatorias
descripcion: >-
  La distribución de una función de una o más variables aleatorias. La guía
  presenta el método de la función de distribución, válido para cualquier
  transformación aunque no sea inyectiva; el mínimo y el máximo de varias
  variables, con la competencia de exponenciales como caso central; y la suma
  de variables independientes.

secuencia:
