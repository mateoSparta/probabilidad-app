id: g7-07
guia: 7
numero: "7.7"
prioridad: recomendado
fuente:
  enunciado: fuentes/guias/parte1.pdf#p43

enunciado: |
  Llamadas arriban a una central telefónica de acuerdo con un proceso de
  Poisson de intensidad 4 por hora.
  [[condicionar-Nt|Sabiendo que entre las 9:00 y las 10:00 arribaron
  exactamente 3 llamadas]], calcular la probabilidad de que

items:
  - id: a
    pregunta: la primera llamada después de las 9:00 haya arribado antes de las 9:15.
    skills: [condicionar-Nt]
    respuesta:
      tipo: numerica
      valor: "37/64"
    pistas:
      - >-
        Dado que hubo exactamente 3 llamadas en la hora, sus tiempos de arribo
        se distribuyen como tres uniformes independientes en esa hora.
      - >-
        Que la primera llamada haya llegado antes de las 9:15 equivale a que
        al menos una de las tres haya llegado en el primer cuarto de hora.
      - >-
        Plan: cada llamada cae en el primer cuarto de hora con probabilidad
        $1/4$, de manera independiente. Por complemento, la probabilidad es
        $1 - (3/4)^3$. La intensidad no interviene en la respuesta.
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g7_07.py
          valor: "37/64"

  - id: b
    pregunta: la segunda llamada después de las 9:00 haya arribado antes de las 9:30.
    skills: [condicionar-Nt]
    respuesta:
      tipo: numerica
      valor: "1/2"
    pistas:
      - 'Expresá el evento "la segunda llamada llegó antes de las 9:30" como un conteo.'
      - Equivale a que al menos dos de las tres llamadas hayan llegado en la primera media hora.
      - >-
        Plan: usá una binomial con 3 ensayos y probabilidad $1/2$, y calculá
        $1 - P(0) - P(1)$. Por simetría, el resultado es exactamente $1/2$.
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g7_07.py
          valor: "1/2"
