id: g7-10
guia: 7
numero: "7.10"
prioridad: recomendado
fuente:
  enunciado: fuentes/guias/parte1.pdf#p45

enunciado: |
  Una máquina produce rollos de alambre. El alambre tiene fallas distribuidas
  como un proceso de Poisson de intensidad 1 cada 20 metros.
  [[superposicion-adelgazamiento|La máquina detecta cada falla con probabilidad
  $0{,}75$ y corta el alambre en la primera falla detectada.]]

items:
  - id: a
    pregunta: >-
      Hallar la media y la varianza de
      [[tiempos-espera|la longitud de los rollos de alambre]].
    skills: [superposicion-adelgazamiento, tiempos-espera]
    respuesta:
      tipo: checkpoints
      checkpoints:
        - pregunta: 'la media, en metros'
          valor: "80/3"
        - pregunta: 'la varianza'
          valor: "6400/9"
          tol_rel: 0.001
    pistas:
      - ¿Qué proceso forman las fallas **detectadas**?
      - >-
        Si en un proceso de Poisson se conserva cada evento con probabilidad
        $p$, los eventos conservados forman un proceso de Poisson de
        intensidad $p\lambda$.
      - >-
        Plan: la intensidad de las fallas detectadas es $0{,}75/20$ por metro.
        La longitud del rollo es la distancia hasta la primera falla
        detectada, que tiene distribución exponencial. Para una exponencial,
        la varianza es el cuadrado de la media.
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g7_10.py
          valor: "80/3, 6400/9"

  - id: b
    pregunta: Hallar la cantidad media de [[geometrica-pascal|fallas en los rollos]].
    skills: [superposicion-adelgazamiento, geometrica-pascal]
    respuesta:
      tipo: numerica
      valor: "4/3"
      tol_rel: 0.005
    pistas:
      - La pregunta se refiere a **todas** las fallas, incluidas las no detectadas.
      - >-
        El rollo contiene la falla detectada que lo cortó y las fallas no
        detectadas anteriores a ella. ¿Cuántas son estas últimas, en media?
      - >-
        Plan: las fallas no detectadas anteriores a la primera detectada son
        los fracasos previos al primer éxito con $p = 0{,}75$, cuya cantidad
        tiene distribución geométrica de media $(1-p)/p$. A ese valor hay que
        sumarle la falla detectada.
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g7_10.py
          valor: "4/3"
