numero: 7
titulo: Proceso de Poisson
descripcion: >-
  El modelo para eventos que ocurren al azar en el tiempo. La guía estudia sus
  dos descripciones equivalentes, el conteo en intervalos y los tiempos de
  espera, y la relación entre ambas; el efecto de condicionar al total de
  eventos, que vuelve uniformes los tiempos de arribo y elimina la intensidad
  del cálculo; la superposición y el adelgazamiento de procesos; y la suma de
  una cantidad aleatoria de términos.

