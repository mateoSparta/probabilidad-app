id: g5-04
guia: 5
numero: "5.4"
prioridad: recomendado
fuente:
  enunciado: fuentes/guias/parte1.pdf#p33

enunciado: |
  Sea $(X, Y)$ un vector aleatorio con la densidad conjunta del Ejercicio
  3.22, es decir, [[conjunta-marginales|con densidad conjunta
  $f_{X,Y}(x, y) = \frac{5}{8\pi}\, e^{-\frac{25}{32}\left(x^2 - \frac{6}{5}xy + y^2\right)}$]].

items:
  - id: a
    pregunta: >-
      Hallar [[normal|$f_Y(y)$]] y [[esperanza-condicional|$f_{Y \mid X = x}(y)$]] para
      todo $x \in \mathbb{R}$, y evaluarlas donde se pide.
    skills: [conjunta-marginales, esperanza-condicional, normal]
    respuesta:
      tipo: checkpoints
      checkpoints:
        - pregunta: '$f_Y(0)$'
          valor: "1 / sqrt(2*pi)"
        - pregunta: '$f_{Y \mid X = 1}(3/5)$'
          valor: "5 / (4 * sqrt(2*pi))"
        - pregunta: '$f_{Y \mid X = 0}(1)$'
          valor: "5 / (4 * sqrt(2*pi)) * exp(-25/32)"
    pistas:
      - >-
        La densidad es una normal bivariada. Como en el 3.22,
        conviene identificar la matriz de covarianza a partir del exponente.
      - >-
        $X$ e $Y$ son normales estándar con correlación $\rho = 3/5$, y la
        condicional de $Y$ dado $X = x$ es normal de media $\rho x$ y varianza
        $1 - \rho^2$.
      - >-
        Plan: escribí las dos densidades normales con esos parámetros y
        evaluá. Como control, $f_{Y \mid X = x}$ tiene que coincidir con
        $f_{X,Y}(x, \cdot)/f_X(x)$.
    verificacion:
      estado: verificado
      metodo: exacto+cuadratura
      fuentes_valor:
        - origen: tools/verify/g5_04.py
          valor: "1/sqrt(2 pi), 5/(4 sqrt(2 pi)), 5/(4 sqrt(2 pi)) e^(-25/32)"

  - id: b
    pregunta: '¿Qué se puede decir respecto de la [[independencia-va|independencia]] de $X$ e $Y$?'
    skills: [independencia-va]
    respuesta:
      tipo: opcion
      opciones:
        - id: b1
          texto: 'No son independientes, porque la distribución de $Y \mid X = x$ depende de $x$.'
          correcta: true
        - id: b2
          texto: 'Son independientes, porque las dos marginales son normales.'
          error_tipico: >-
            Que las marginales sean normales no dice nada sobre la
            independencia. Hay que comparar la conjunta con el producto de las
            marginales, o ver si la condicional depende de $x$.
        - id: b3
          texto: 'Son independientes, porque el soporte es todo el plano.'
          error_tipico: >-
            El soporte rectangular es una condición necesaria, pero no
            suficiente. El término cruzado $xy$ del exponente impide que la
            densidad factorice.
        - id: b4
          texto: 'No se puede decidir sin calcular la covarianza.'
          error_tipico: >-
            Alcanza con ver que la condicional depende de $x$. Además, la
            covarianza vale $3/5$, que ya descarta la independencia.
    pistas:
      - Dos variables son independientes si la condicional de una dada la otra no depende del valor condicionante.
      - Mirá la media de $Y \mid X = x$ hallada en el ítem anterior.
      - >-
        Plan: decidí si la densidad condicional cambia con $x$; si cambia, no
        son independientes.
    verificacion:
      estado: verificado
      metodo: exacto
      fuentes_valor:
        - origen: tools/verify/g5_04.py
          valor: "Y | X = x ~ N(3x/5, 16/25): depende de x"

  - id: c
    pregunta: 'Calcular [[esperanza-condicional,normal|$P(1 < XY < 5 \mid X = \sqrt{5})$]].'
    skills: [esperanza-condicional, normal]
    respuesta:
      tipo: numerica
      rotulo: 'P(1 < XY < 5 \mid X = \sqrt{5})'
      valor: "erf(sqrt(10)/4)"
    pistas:
      - 'Dado $X = \sqrt{5}$, el evento $1 < XY < 5$ es $1/\sqrt{5} < Y < \sqrt{5}$.'
      - >-
        La distribución de $Y$ dado $X = \sqrt{5}$ es normal, con la media y
        la varianza halladas en el ítem (a).
      - >-
        Plan: estandarizá los dos extremos con la media $3/\sqrt{5}$ y el
        desvío $4/5$, y restá los valores de $\Phi$. Los extremos quedan
        simétricos respecto de la media.
    verificacion:
      estado: verificado
      metodo: exacto+cuadratura
      fuentes_valor:
        - origen: tools/verify/g5_04.py
          valor: "2 Phi(sqrt(5)/2) - 1 = 0.7364"
