numero: 5
titulo: Condicionamiento y mezclas
descripcion: >-
  El condicionamiento a una variable aleatoria en lugar de a un evento. La
  esperanza condicional pasa a ser una variable aleatoria, y de ella se
  derivan dos herramientas de uso constante en el resto de la materia: la
  esperanza total, incluso en planteos recursivos, y la varianza total. La
  guía incluye además la regla de Bayes cuando la observación es continua.

