numero: 5
titulo: Condicionamiento y mezclas
descripcion: >-
  Condicionar a una variable en lugar de a un evento. La esperanza condicional
  deja de ser un número y pasa a ser una variable aleatoria, y de ahí salen las
  dos herramientas que resuelven casi todo lo que sigue: la esperanza total
  —incluso cuando el planteo se refiere a sí mismo— y la varianza total. Más
  Bayes cuando lo observado es continuo.

