id: g2-01
guia: 2
numero: "2.1"
prioridad: recomendado
fuente:
  enunciado: fuentes/guias/parte1.pdf#p10

enunciado: |
  Sea $(\Omega, \mathcal{A}, P)$ un espacio de probabilidad en el que
  $\Omega = \{1, 2, 3, 4, 5, 6\}$ y
  [[variable-aleatoria|$\mathcal{A} = \{\emptyset,\ \{1, 3, 5\},\ \{2, 4, 6\},\ \Omega\}$]].
  Determinar cuáles de las siguientes funciones $X : \Omega \to \mathbb{R}$ son
  variables aleatorias.

items:
  - id: a
    pregunta: '$X(\omega) = \omega$'
    skills: [variable-aleatoria]
    respuesta:
      tipo: opcion
      opciones:
        - id: a1
          texto: 'No, porque $\{X \le 1\} = \{1\}$ no pertenece a $\mathcal{A}$.'
          correcta: true
        - id: a2
          texto: 'Sí, porque está definida en todo $\Omega$ y toma valores reales.'
          error_tipico: >-
            Ser una función de $\Omega$ en $\mathbb{R}$ no alcanza. Además, las
            preimágenes de los intervalos $(-\infty, t]$ tienen que pertenecer
            al álgebra.
        - id: a3
          texto: 'Sí, porque es inyectiva y por lo tanto medible.'
          error_tipico: >-
            La inyectividad no garantiza la medibilidad. En este caso es
            justamente el problema, porque al separar todos los puntos la
            función divide los bloques del álgebra.
        - id: a4
          texto: 'No, porque toma seis valores distintos y $\mathcal{A}$ tiene cuatro elementos.'
          error_tipico: >-
            La cantidad de valores que toma la función no determina la
            medibilidad. El criterio es que las preimágenes pertenezcan a
            $\mathcal{A}$.
    pistas:
      - '¿Qué tiene que cumplir el conjunto $\{\omega : X(\omega) \le t\}$ para cada $t$?'
      - 'El álgebra $\mathcal{A}$ tiene solo cuatro elementos, que son el conjunto vacío, los impares, los pares y $\Omega$.'
      - >-
        Plan: elegí algún $t$ y calculá la preimagen $\{X \le t\}$. Si no
        coincide con ninguno de esos cuatro conjuntos, $X$ no es una variable
        aleatoria.
    verificacion:
      estado: verificado
      metodo: exacto
      fuentes_valor:
        - origen: tools/verify/g2_01.py
          valor: "no; contraejemplo {X <= 1} = [1]"

  - id: b
    pregunta: '$X(\omega) = \mathbf{1}\{\omega \text{ es par}\}$'
    skills: [variable-aleatoria]
    respuesta:
      tipo: opcion
      opciones:
        - id: b1
          texto: 'Sí, porque es constante en los impares y en los pares, que son los bloques de $\mathcal{A}$.'
          correcta: true
        - id: b2
          texto: 'No, porque solo toma los valores 0 y 1.'
          error_tipico: >-
            Tomar pocos valores no impide la medibilidad. Una función
            indicadora puede ser una variable aleatoria.
        - id: b3
          texto: 'No, porque $\{X \le 0\} = \{1, 3, 5\}$ y ese conjunto no está en $\mathcal{A}$.'
          error_tipico: >-
            $\{1,3,5\}$ **sí** pertenece a $\mathcal{A}$, ya que es uno de los
            cuatro elementos que lista el enunciado.
        - id: b4
          texto: 'Depende de cómo se defina $P$ sobre $\mathcal{A}$.'
          error_tipico: >-
            La medibilidad es una condición que involucra únicamente a $X$ y a
            $\mathcal{A}$. La probabilidad $P$ no interviene.
    pistas:
      - Calculá el valor de esta función en cada punto de $\Omega$.
      - 'Verificá si toma un único valor en $\{1,3,5\}$ y un único valor en $\{2,4,6\}$.'
      - >-
        Plan: si la función es constante en cada bloque del álgebra, toda
        preimagen es una unión de bloques, y esas uniones pertenecen a
        $\mathcal{A}$.
    verificacion:
      estado: verificado
      metodo: exacto
      fuentes_valor:
        - origen: tools/verify/g2_01.py
          valor: "si"

  - id: c
    pregunta: '$X(\omega) = \mathbf{1}\{\omega \in \{1, 4\}\}$'
    skills: [variable-aleatoria]
    respuesta:
      tipo: opcion
      opciones:
        - id: c1
          texto: 'No, porque $\{X \le 0\} = \{2, 3, 5, 6\}$ no pertenece a $\mathcal{A}$.'
          correcta: true
        - id: c2
          texto: 'Sí, porque es una indicadora y el ítem anterior también lo era.'
          error_tipico: >-
            Ser una indicadora no alcanza. Lo que importa es **de qué**
            conjunto lo es, y $\{1,4\}$ contiene puntos de los dos bloques del
            álgebra.
        - id: c3
          texto: 'Sí, porque $\{1, 4\}$ tiene un elemento par y uno impar.'
          error_tipico: >-
            Esa es justamente la causa del problema. Al mezclar un impar con un
            par, la función deja de ser constante en cada bloque.
        - id: c4
          texto: 'No, porque $\{1,4\}$ no pertenece a $\mathcal{A}$.'
          error_tipico: >-
            La conclusión es correcta, pero el criterio no lo es. Lo que debe
            pertenecer a $\mathcal{A}$ son las preimágenes $\{X \le t\}$. En
            este caso ambos razonamientos llevan al mismo veredicto, pero solo
            el de las preimágenes es válido en general.
    pistas:
      - Compará este conjunto con el del ítem anterior. ¿En qué se diferencian?
      - '¿Toma el mismo valor en 1 que en 3?'
      - >-
        Plan: calculá $\{X \le 0\}$ y comparalo con los cuatro elementos de
        $\mathcal{A}$.
    verificacion:
      estado: verificado
      metodo: exacto
      fuentes_valor:
        - origen: tools/verify/g2_01.py
          valor: "no; contraejemplo {X <= 0} = [2, 3, 5, 6]"
