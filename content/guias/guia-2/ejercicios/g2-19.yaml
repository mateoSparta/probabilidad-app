id: g2-19
guia: 2
numero: "2.19"
prioridad: recomendado
fuente:
  enunciado: fuentes/guias/parte1.pdf#p14

enunciado: |
  El diámetro $X$ (en mm) de las arandelas fabricadas por una máquina tiene
  como función de densidad a
  [[densidad|$f_X(x) = \dfrac{2x}{225}\, \mathbf{1}\{0 < x < 15\}$]].
  [[truncamiento|Un sistema de control descarta las arandelas cuyo diámetro es
  inferior a 3 o superior a 12.]]

items:
  - id: a
    pregunta: >-
      Hallar la densidad del diámetro de las arandelas **no descartadas**, y
      evaluarla donde se pide.
    skills: [truncamiento, densidad]
    respuesta:
      tipo: checkpoints
      checkpoints:
        - pregunta: 'la densidad en $x = 5$'
          valor: "2/27"
        - pregunta: 'la densidad en $x = 10$'
          valor: "4/27"
        - pregunta: '$P(X < 6)$ entre las no descartadas'
          valor: "1/5"
    pistas:
      - Primero hace falta la probabilidad de que una arandela no sea descartada.
      - La densidad condicional es la original restringida al intervalo y dividida por esa probabilidad.
      - >-
        Plan: integrá $f_X$ entre 3 y 12 para obtener $P(A)$, y después usá
        $f_{X \mid A}(x) = f_X(x)/P(A)$ para $3 < x < 12$. Como control, la
        nueva densidad tiene que integrar 1 en $(3, 12)$.
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g2_19.py
          valor: "2/27, 4/27, 1/5"
        - origen: "tools/verify/g2_19.py (control: P(no descartada))"
          valor: "3/5"

  - id: b
    pregunta: >-
      Hallar la densidad del diámetro de las arandelas **descartadas**, y
      evaluarla donde se pide.
    skills: [truncamiento, densidad]
    respuesta:
      tipo: checkpoints
      checkpoints:
        - pregunta: 'la densidad en $x = 2$'
          valor: "2/45"
        - pregunta: 'la densidad en $x = 13$'
          valor: "13/45"
        - pregunta: 'la densidad en $x = 5$'
          valor: "0"
    pistas:
      - 'El evento "descartada" es la unión de dos condiciones incompatibles.'
      - >-
        ¿Cuál es el soporte de esta densidad? Observá que no es un intervalo,
        porque excluye una zona intermedia.
      - >-
        Plan: $P(\text{descartada}) = 1 - P(\text{aceptada})$, y la densidad es
        $f_X(x)$ dividida por esa probabilidad, **solo** en la zona donde la
        arandela se descarta. Entre 3 y 12 la densidad vale cero, y omitir ese
        detalle es el error más frecuente en este ejercicio.
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g2_19.py
          valor: "2/45, 13/45, 0"
        - origen: "tools/verify/g2_19.py (control: P(descartada))"
          valor: "2/5"
