id: g2-17
guia: 2
numero: "2.17"
prioridad: recomendado
fuente:
  enunciado: fuentes/guias/parte1.pdf#p16

# Se cargan (a) y (d). Los incisos (b) y (c) piden clasificar productos según
# su modo de falla e interpretar gráficos: son preguntas de interpretación,
# sin una respuesta que la app pueda validar.
enunciado: |
  Sea $T$ el tiempo hasta que ocurre la primera falla en un producto
  industrial, con [[funcion-distribucion,densidad|función intensidad de fallas
  $\lambda(t)$ de la forma
  $\lambda(t) = \dfrac{\beta}{\alpha} \left(\dfrac{t}{\alpha}\right)^{\beta - 1} \mathbf{1}\{t > 0\}$,
  donde $\alpha, \beta > 0$]].
  Si $\beta < 1$ se dice que el producto tiene fallas tempranas, si
  $\beta = 1$ se dice que tiene fallas casuales o con falta de memoria, y si
  $\beta > 1$ se dice que tiene fallas por desgaste.

items:
  - id: a
    pregunta: >-
      Hallar la función de distribución y la función densidad de $T$, y
      evaluarlas en el caso $\alpha = 2$, $\beta = 3$.
    skills: [funcion-distribucion, densidad]
    respuesta:
      tipo: checkpoints
      checkpoints:
        - pregunta: '$F_T(1)$'
          valor: "1 - exp(-1/8)"
        - pregunta: '$F_T(2)$'
          valor: "1 - exp(-1)"
        - pregunta: '$f_T(1)$'
          valor: "3/8 * exp(-1/8)"
    pistas:
      - 'La intensidad de fallas determina la cola, $P(T > t) = \exp\left(-\int_0^t \lambda(s)\, ds\right)$.'
      - >-
        La integral de $\lambda$ entre 0 y $t$ es una potencia de $t/\alpha$.
        La densidad es la derivada de $F_T$, o bien $\lambda(t)\, P(T > t)$.
      - >-
        Plan: integrá $\lambda$, armá $F_T = 1 - P(T > t)$, derivala y
        reemplazá $\alpha$, $\beta$ y los valores de $t$.
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g2_17.py
          valor: "1 - exp(-1/8), 1 - exp(-1), 3/8 exp(-1/8)"

  - id: b
    pregunta: >-
      Con $\alpha = 1$ y $\beta = 0{,}5$, $1$ y $1{,}5$, calcular $P(T > 1)$ y
      [[truncamiento,perdida-memoria|$P(T > 4 \mid T > 3)$]].
    skills: [truncamiento, perdida-memoria, funcion-distribucion]
    respuesta:
      tipo: checkpoints
      checkpoints:
        - pregunta: '$P(T > 1)$'
          valor: "exp(-1)"
        - pregunta: '$P_{\beta = 0{,}5}(T > 4 \mid T > 3)$'
          valor: "exp(sqrt(3) - 2)"
        - pregunta: '$P_{\beta = 1}(T > 4 \mid T > 3)$'
          valor: "exp(-1)"
        - pregunta: '$P_{\beta = 1{,}5}(T > 4 \mid T > 3)$'
          valor: "exp(3 * sqrt(3) - 8)"
    pistas:
      - 'Con $\alpha = 1$, $P(T > t) = e^{-t^\beta}$. En $t = 1$ el exponente no depende de $\beta$.'
      - >-
        El condicional es un cociente de colas,
        $P(T > 4 \mid T > 3) = P(T > 4) / P(T > 3)$.
      - >-
        Plan: calculá el cociente para cada $\beta$ y compará los tres
        resultados con $P(T > 1)$. Con $\beta = 1$ coinciden, por la pérdida
        de memoria; con fallas tempranas el producto que ya duró 3 tiene más
        chances de seguir, y con desgaste, menos.
    verificacion:
      estado: verificado
      metodo: exacto+montecarlo
      fuentes_valor:
        - origen: tools/verify/g2_17.py
          valor: "exp(-1), exp(sqrt(3) - 2), exp(-1), exp(3 sqrt(3) - 8)"
