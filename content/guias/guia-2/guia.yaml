numero: 2
titulo: Variables aleatorias y vectores
descripcion: >-
  El paso de los eventos a las magnitudes numéricas. La guía estudia qué
  condición debe cumplir una función de Ω en los reales para ser una variable
  aleatoria, cómo se describe su distribución (mediante la función de
  distribución en general y mediante la densidad en el caso continuo), cómo
  cambia al condicionar a un evento y qué conceptos aparecen al pasar a
  vectores aleatorios: distribución conjunta, marginales e independencia.

secuencia:
  - teoria: t-variable-aleatoria
  - ejercicio: g2-01

  - teoria: t-distribucion
  - ejercicio: g2-08

  - teoria: t-truncamiento
  - ejercicio: g2-19

  - teoria: t-conjunta
  - ejercicio: g2-22
  - ejercicio: g2-26
