numero: 2
titulo: Variables aleatorias y vectores
descripcion: >-
  De eventos a números. Qué hace falta para que una función de Ω en los reales
  sea una variable aleatoria, cómo se describe su distribución —por la función
  de distribución si hay saltos, por la densidad si es continua—, qué pasa
  cuando se la condiciona a un evento, y qué cambia al pasar de una variable a
  un vector: conjunta, marginales e independencia.

