- numero: '1.36'
  paginas:
  - 10
  marcas: []
  en_alcance: true
  enunciado: Una materia se aprueba con un examen multiple choice de 5 preguntas, con 3 opciones de respuesta
    en cada pregunta. Se asume que los eventos A_{i} =“el alumno contesta correctamente la pregunta i”
    son independientes y tienen todos la misma probabilidad p.
  items:
  - id: a
    texto: ¿Cómo debería establecerse un criterio de aprobación (cantidad de respuestas correctas) para
      asegurar que sean reprobados al menos el 95 % los alumnos que no saben nada de la materia y responden
      totalmente al azar?
  - id: b
    texto: Fijado el criterio anterior, si un alumno estudió lo suficiente como para que la probabilidad
      de responder bien cada una de las preguntas sea p = 0.8, ¿con qué probabilidad aprobará el examen?
  - id: c
    texto: Graficar la probabilidad de aprobar en función de p. ¿Para qué valor de p se aprueba el examen
      con probabilidad mayor a 0.95?
- numero: '1.37'
  paginas:
  - 10
  - 11
  marcas: []
  en_alcance: true
  enunciado: 'Una empresa compra una gran de cantidad de bulones a un mismo proveedor. Cada vez que se
    recibe un envío, se realiza un control de calidad por muestreo: se prueban 80 bulones seleccionados
    al azar del total; si se encuentra más de un bulón defectuoso se rechaza el envío. En caso contrario,
    se lo acepta. Sea p la probabilidad de producir un bulón defectuoso en el proceso de fabricación.
    De acuerdo a los estándares de calidad, se desea satisfacer la condición p < 0.005. Los defectos de
    los bulones son independientes entre sí.'
  items:
  - id: a
    texto: Hallar la probabilidad de rechazar un lote fabricado bajo la condición p = 0.004.
  - id: b
    texto: Hallar la probabilidad de aceptar un lote fabricado bajo la condición p = 0.05.
  - id: c
    texto: Graficar la probabilidad de aceptar un envío en función de p (Curva característica del plan
      de muestreo).
  - id: d
    texto: Si se sabe que el lote cumple los estándares de calidad, ¿cuál es la máxima probabilidad de
      tomar una decisión errónea sobre el mismo?
