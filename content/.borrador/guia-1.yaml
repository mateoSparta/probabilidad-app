- numero: '1.33'
  paginas:
  - 9
  marcas: []
  en_alcance: true
  enunciado: Sea Ω = [0, 1] \times [0, 1] el cuadrado unitario. Consideraremos eventos a los subconjuntos
    Λ \subset Ω que admiten área \midΛ\mid, y definimos P(Λ) = \midΛ\mid.
  items:
  - id: a
    texto: 'Sea A = \{(x, y) \in Ω: x^{2} + y^{2} \le 1\}. Hallar P(A).'
  - id: b
    texto: 'Sean, para k = 1, 2,\ldots, B_{k} = \{(x, y) \in Ω: x + y \le 1/2 + 1/k\}. Hallar P(B_{k})
      y P(\bigcap^{\infty} k=1 B^{k}).'
  - id: c
    texto: 'Sean, para k = 1, 2,\ldots, C_{k} = \{(x, y) \in Ω: (x - 1/2)^{2} + (y - 1/2)^{2} \le 1/k^{2}\}
      y C = \bigcap^{\infty} k=1 C^{k}. Hallar P(C^{k}) y P(C).'
  - id: d
    texto: Suponer que Ω modela un blanco cuadrado al que se dispara un dardo, y P(Λ) es la probabilidad
      de que el dardo se clave en la zona del blanco descrita por Λ. ¿Cómo se describirían en términos
      de lo que pasa con el dardo los eventos C_{k} y C del inciso anterior?
  revisar:
  - revisar los limites del operador grande
- numero: '1.34'
