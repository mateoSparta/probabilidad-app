  en_alcance: true
  enunciado: 'Juan y María juegan a cara o ceca con una moneda equilibrada. Inicialmente Juan tiene cinco
    monedas y María tres. Cuando sale cara Juan le da una moneda a María, cuando sale ceca María le da
    una moneda a Juan. Arrojan sucesivamente la moneda hasta que alguno se queda sin monedas. Hallar la
    probabilidad de que Juan sea el primero en quedarse sin monedas. (sugerencia: si entre los dos tienen
    8 monedas, sea p_{n} la probabilidad de que Juan sea el primero en quedarse sin monedas si inicialmente
    tiene n, con n = 0,\ldots, 8. Hallar p_{0} y p_{8}. Mostrar que p_{n+1} - p_{n} = p_{n} - p_{n-1}
    y resolver ecuaciones. Aplicar al caso n = 5).'
