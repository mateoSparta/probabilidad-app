  en_alcance: false
  enunciado: 'Método de Monte Carlo. Sea f: \mathbb{R} \to [0, \infty) una función continua y sea M =
    máx\{f (x): x \in [a, b]\}.'
  items:
  - id: a
    texto: Se elige un punto de coordenadas (X, Y) al azar en el rectángulo [a, b]\times[0, M]. Relacionar
      la probabilidad del evento A = \{Y \le f (X)\} con el valor de la integral \int_{b} a f (x)dx.
  - id: b
    texto: Obtener un método para estimar el valor de la integral \int_{b} a f (x)dx basado en los resultados
      de n simulaciones del experimento descrito en el inciso anterior.
  - id: c
    texto: Utilizar el método obtenido en el inciso anterior para estimar el valor de la integral \int_{2}
      0 e^{-x2} dx basándose en los resultados de 10.000 simulaciones.
  revisar:
