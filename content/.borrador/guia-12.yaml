  enunciado: 'El Gobierno de la Ciudad Autónoma de Buenos Aires contrata a una empresa encuestadora para
    “determinar” la proporción, p, de la población de la Ciudad irritada por las polémicas declaraciones
    de uno de sus flamantes ministros. Para analizar los datos la encuestadora cuenta con dos especialistas:
    el primero opina que la densidad a priori para p es f_{1}(p) = 10(1 - p)^{9}1\{0 < p < 1\}, pero el
