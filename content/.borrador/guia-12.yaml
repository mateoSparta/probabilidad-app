  items:
  - id: a
    texto: Analizar qué significado tienen esas dos opiniones y qué consecuencias tienen sobre el análisis
      de los datos si se decide que para estimar p se utilizará la media de la distribución a posteriori
      basada en el resultado de una encuesta realizada a 10 vecinos de la Ciudad.
  - id: b
    texto: ¿Qué cantidad de vecinos de la Ciudad deben encuestarse si se quiere que las medias de las
      dos distribuciones a posteriori de p difieran en menos de 0.001?
