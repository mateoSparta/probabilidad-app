    obedecía a una distribución de Poisson(µ). Bortkiewicz registró la cantidad de muertos por año en
    cada uno de 10 cuerpos de caballería durante 20 años, obteniendo así 200 registros. Publicó la siguiente
    tabla que describe los registros: Muertes 0 1 2 3 4 Frecuencia 109 65 22 3 1 Utilizando como distribución
    a priori para µ una Gamma de media 1/2 y varianza 1/8, calcular la media de la distribución a posteriori
    de µ basada en los datos publicados por Bortkiewicz.'
