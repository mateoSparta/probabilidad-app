  en_alcance: false
  enunciado: '[Capacidad de procesos] La calidad de un proceso industrial suele caracterizarse por alguna
    variable aleatoria X, medible sobre dicho proceso o sobre el producto fabricado por él (por ejemplo,
    X puede ser el diámetro de piezas torneadas, la corriente eléctrica en un proceso de soldadura, el
    volumen de llenado de botellas, la dureza de comprimidos farmacéuticos o su concentración de principio
    activo, etc). Se suelen definir límites superior e inferior de especificación (LSE y LIE) como aquellos
    valores a partir de los cuales el producto resulta no conforme o defectuoso. Cuando X pertenece al
    intervalo [LIE, LSE], el producto se considera aceptable. Los sucesivos productos son obtenidos con
    variaciones aleatorias en X, que se suponen normales. Cuando el proceso es centrado (el intervalo
    se encuentra centrado en µ_{X}), la capacidad del proceso de elaboración se define como la aptitud
    para generar productos dentro de los límites, y se cuantifica a través del índice de capacidad C_{p}
    = \frac{LSE-LIE}{6σX}.'
  items:
  - id: a
    texto: Interpretar el significado de C_{p}.
  - id: b
    texto: 'De un proceso centrado con límites LIE = 10.90 mm. y LSE = 11.10 mm. se midieron n = 15 piezas,
      obteniendo (en mm.): 10.98, 10.92, 11.01, 11.08, 11.07, 11.10, 10.87, 10.99, 11.07, 10.93, 10.96,
      10.90, 10.89, 10.94, 10.95. Estimar con esta muestra σ_{X} como \sqrt \frac{?}{S2} (ver Ejercicio
