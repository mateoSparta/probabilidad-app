  enunciado: Se realiza repetidas veces un experimento, en forma independiente una de la otra. Cada vez
    que se realiza cierto evento B puede suceder, con probabilidad p, o no, con probabilidad 1 - p. Notaremos
    B_{n} al evento “sucedió B en la n-ésima realización del experimento”. Llamamos N a la variable aleatoria
    “cantidad de realizaciones del experimento hasta que por primera vez B sucede en dos realizaciones
    consecutivas”.
  items:
  - id: a
    texto: Mostrar que P(N = 1) = 0, P(N = 2) = p^{2}, P(N = 3) = (1 - p)p^{2}.
  - id: b
    texto: 'Sean los eventos A_{1} = ¯B_{1}, A_{2} = B_{1} \cap ¯B_{2}, A_{3} = ¯B_{1} \cap ¯B_{2}. Mostrar
      que forman una partición, y por aplicación del teorema de probabilidades totales deducir que: P(N
      = n + 2) = P(N = n + 1)P(A_{1}) + P(N = n)P(A_{2}) para n \ge 1 y que P(N = 2\mid A_{3}) = 1.'
  - id: c
    texto: 'Notando p_{n} = P(N = n), n \ge 1 tenemos entonces: p_{1} = 0, p_{2} = p^{2}, p_{n+2} = (1
      - p)p_{n+1} + (1 - p)pp_{n}, n \ge 1. Resolviendo la ecuación en diferencias, hallar la expresión
      general de p_{n}.'
