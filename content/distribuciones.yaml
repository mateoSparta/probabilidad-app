# Las fichas de la calculadora de distribuciones (PLAN.md §12.4). Notación,
# soporte, parámetros, función, esperanza y varianza son los de la tabla de
# la cátedra (fuentes/teoria/probabilidad_distribuciones.pdf), y también los
# modelos de las discretas, las funciones de supervivencia y las
# equivalencias. Los modelos de las continuas y de las multivariadas son
# propios; ver revision/distribuciones.md.
#
# La cuenta (densidades, distribuciones, cuantiles) está en
# src/dominio/distribuciones.ts, con el mismo id.

- id: bernoulli
  nombre: Bernoulli
  grupo: discreta
  notacion: 'X \sim \text{Ber}(p)'
  funcion: 'p_X(x) = p^x (1-p)^{1-x}'
  soporte: '\{0, 1\}'
  parametros: 'p \in (0, 1)'
  esperanza: 'p'
  varianza: 'p(1-p)'
  modelo: 'Modela un experimento con dos resultados posibles. Asigna el valor 1 al éxito, que tiene probabilidad $p$, y 0 al fracaso.'
  equivalencias: ['\text{Ber}(p) \equiv \mathcal{B}(1, p)']
  tips:
    - 'Es el bloque con el que se construyen la binomial, la geométrica y la Pascal, que cuentan éxitos o ensayos en repeticiones independientes de un mismo experimento de Bernoulli.'
    - 'La indicadora $\mathbf{1}_A$ de un evento es una Bernoulli con $p = P(A)$, y por eso $E[\mathbf{1}_A] = P(A)$. Escribir un conteo como suma de indicadoras permite calcular su esperanza sumando probabilidades.'
    - 'La varianza $p(1-p)$ es máxima en $p = 1/2$, donde vale $1/4$, y se anula en los extremos, cuando el resultado es seguro.'

- id: binomial
  nombre: Binomial
  grupo: discreta
  notacion: 'X \sim \mathcal{B}(n, p)'
  funcion: 'p_X(x) = \binom{n}{x} p^x (1-p)^{n-x}'
  soporte: '\{0, 1, \dots, n\}'
  parametros: 'p \in (0, 1),\ n \in \mathbb{N}'
  esperanza: 'np'
  varianza: 'np(1-p)'
  modelo: 'Modela la cantidad de éxitos obtenidos al repetir $n$ veces, de forma independiente, un experimento de Bernoulli con probabilidad $p$ de éxito.'
  tips:
    - 'Es la suma de $n$ Bernoulli independientes de parámetro $p$; de ahí salen $E[X] = np$ y $\operatorname{var}(X) = np(1-p)$ sin operar con la función de probabilidad.'
    - 'Corresponde a extracciones con reposición. Sin reposición, la cantidad de éxitos es hipergeométrica, y las dos se parecen cuando la población es mucho más grande que la muestra.'
    - 'Con $n$ grande y $p$ chico se aproxima por una Poisson de media $\mu = np$; con $np(1-p)$ grande, por una normal, según el teorema central del límite.'
    - 'Si $X \sim \mathcal{B}(n_1, p)$ e $Y \sim \mathcal{B}(n_2, p)$ son independientes, $X + Y \sim \mathcal{B}(n_1 + n_2, p)$.'

- id: geometrica
  nombre: Geométrica
  grupo: discreta
  notacion: 'X \sim \mathcal{G}(p)'
  funcion: 'p_X(x) = (1-p)^{x-1} p'
  soporte: '\{1, 2, 3, \dots\}'
  parametros: 'p \in (0, 1)'
  esperanza: '1/p'
  varianza: '(1-p)/p^2'
  modelo: 'Modela la cantidad de ensayos necesarios hasta obtener el primer éxito, si se repite de forma independiente un experimento de Bernoulli con probabilidad $p$ de éxito. No tiene memoria.'
  equivalencias: ['\mathcal{G}(p) \equiv \text{Pas}(1, p)']
  tips:
    - 'Es la única distribución discreta sin memoria, $P(X > s + t \mid X > s) = P(X > t)$. Haber fracasado $s$ veces no acerca el primer éxito.'
    - 'Es la versión discreta de la exponencial. $P(X > n) = (1-p)^n$ decae geométricamente, como $e^{-\lambda t}$ decae exponencialmente.'
    - 'En promedio hacen falta $1/p$ ensayos; con un dado equilibrado se esperan 6 tiradas hasta obtener el primer seis.'
    - 'Algunos textos cuentan los fracasos anteriores al primer éxito en lugar de los ensayos, con soporte $\{0, 1, 2, \dots\}$ y esperanza $(1-p)/p$. Conviene revisar qué convención usa cada fuente.'

- id: pascal
  nombre: Pascal
  grupo: discreta
  notacion: 'X \sim \text{Pas}(k, p)'
  funcion: 'p_X(x) = \binom{x-1}{k-1} (1-p)^{x-k} p^k'
  soporte: '\{k, k+1, k+2, \dots\}'
  parametros: 'p \in (0, 1),\ k \in \mathbb{N}'
  esperanza: 'k/p'
  varianza: 'k(1-p)/p^2'
  modelo: 'Modela la cantidad de ensayos necesarios hasta obtener $k$ éxitos, si se repite de forma independiente un experimento de Bernoulli con probabilidad $p$ de éxito. Algunos autores la llaman binomial negativa.'
  tips:
    - 'Es la suma de $k$ geométricas independientes de parámetro $p$, una por cada éxito; por eso su esperanza y su varianza son $k$ veces las de la geométrica.'
    - 'La binomial y la Pascal miran el mismo experimento desde lados opuestos. La binomial fija los ensayos y cuenta éxitos; la Pascal fija los éxitos y cuenta ensayos.'
    - 'Si $X \sim \text{Pas}(k, p)$ e $Y \sim \mathcal{B}(n, p)$, entonces $P(X \le n) = P(Y \ge k)$, porque el $k$-ésimo éxito llega a más tardar en el ensayo $n$ exactamente cuando en los primeros $n$ ensayos hay al menos $k$ éxitos.'
    - 'Es la análoga discreta de la Gamma, que mide el tiempo hasta el $k$-ésimo evento de un proceso de Poisson.'

- id: poisson
  nombre: Poisson
  grupo: discreta
  notacion: 'X \sim \text{Poi}(\mu)'
  funcion: 'p_X(x) = \dfrac{\mu^x e^{-\mu}}{x!}'
  soporte: '\{0, 1, 2, \dots\}'
  parametros: '\mu > 0'
  esperanza: '\mu'
  varianza: '\mu'
  modelo: 'Modela la cantidad de eventos en un intervalo cuando ocurren de a uno, de forma independiente y a tasa constante, como en un proceso de Poisson. Aproxima a la binomial con $n$ grande y $p$ chico, con $\mu = np$.'
  tips:
    - 'Se la llama ley de los eventos raros. Cuenta sucesos que pueden ocurrir en muchas oportunidades, cada una con probabilidad muy chica, como llamadas a una central, errores de tipeo en una página o partículas detectadas por un contador.'
    - 'Su único parámetro es a la vez la esperanza y la varianza. Si en datos de conteo la varianza observada es mucho mayor que la media, el modelo de Poisson probablemente no es adecuado.'
    - 'La suma de Poisson independientes es Poisson, con la suma de las medias. En un proceso de Poisson de intensidad $\lambda$, la cantidad de eventos en un intervalo de longitud $t$ es $\text{Poi}(\lambda t)$.'
    - 'En 1898, Ladislaus Bortkiewicz la usó para describir la cantidad anual de soldados del ejército prusiano muertos por patadas de caballo, uno de los primeros ajustes célebres de este modelo.'

- id: hipergeometrica
  nombre: Hipergeométrica
  grupo: discreta
  notacion: 'X \sim \mathcal{H}(N, d, n)'
  funcion: 'p_X(x) = \dfrac{\binom{d}{x}\binom{N-d}{n-x}}{\binom{N}{n}}'
  soporte: '\{m, \dots, M\}'
  nota_soporte: 'En la hipergeométrica, $m = \max\{0, d+n-N\}$ y $M = \min\{n, d\}$.'
  parametros: 'd \le N,\ n \le N,\ N \in \mathbb{N}'
  esperanza: 'nd/N'
  varianza: '\dfrac{nd(N-d)(N-n)}{N^2(N-1)}'
  modelo: 'Modela la cantidad de éxitos en $n$ extracciones sin reposición de una población de tamaño total $N$, de los cuales $d$ individuos son éxito y $N - d$ no lo son.'
  tips:
    - 'Es el modelo del muestreo sin reposición, como el control de calidad de un lote o la cantidad de ases en una mano de cartas.'
    - 'Tiene la misma esperanza que la binomial con $p = d/N$, pero una varianza menor, multiplicada por el factor de corrección $\frac{N-n}{N-1}$, porque extraer sin reponer reduce la incertidumbre.'
    - 'Cuando $N$ es mucho más grande que $n$, la diferencia entre extraer con o sin reposición es despreciable y se aproxima por $\mathcal{B}(n, d/N)$.'

- id: uniforme
  nombre: Uniforme
  grupo: continua
  notacion: 'X \sim \mathcal{U}[a, b]'
  funcion: 'f_X(x) = \dfrac{1}{b - a}'
  soporte: '[a, b]'
  parametros: 'a < b'
  esperanza: '(a + b)/2'
  varianza: '(b - a)^2/12'
  modelo: 'Modela un punto elegido al azar en un intervalo. La probabilidad de cada subintervalo es proporcional a su longitud.'
  equivalencias: ['\mathcal{U}(0, 1) \equiv \beta(1, 1)']
  tips:
    - 'Formaliza la idea de elegir un punto al azar en un intervalo. La probabilidad de un subintervalo depende sólo de su longitud, y no de su ubicación.'
    - 'Si $X$ es continua con función de distribución $F_X$, la variable $F_X(X)$ tiene distribución $\mathcal{U}(0, 1)$.'
    - 'La varianza $(b-a)^2/12$ depende sólo del largo del intervalo, de modo que trasladarlo no cambia la dispersión.'

- id: exponencial
  nombre: Exponencial
  grupo: continua
  notacion: 'X \sim \mathcal{E}(\lambda)'
  funcion: 'f_X(x) = \lambda e^{-\lambda x}'
  soporte: '[0, +\infty)'
  parametros: '\lambda > 0'
  esperanza: '1/\lambda'
  varianza: '1/\lambda^2'
  modelo: 'Modela tiempos de espera sin memoria, como el tiempo hasta el primer evento de un proceso de Poisson de intensidad $\lambda$.'
  supervivencia: 'S(t) = e^{-\lambda t},\ t \ge 0'
  equivalencias: ['\mathcal{E}(\lambda) \equiv \Gamma(1, \lambda) \equiv \text{Wei}(1, 1/\lambda)']
  tips:
    - 'Es la única distribución continua sin memoria, $P(X > s + t \mid X > s) = P(X > t)$. Una lámpara con vida exponencial que ya funcionó 100 horas está, en términos probabilísticos, como nueva.'
    - 'Es el tiempo entre eventos consecutivos de un proceso de Poisson de intensidad $\lambda$. Si los eventos ocurren a razón de $\lambda$ por unidad de tiempo, entre uno y otro se espera $1/\lambda$.'
    - 'El mínimo de exponenciales independientes es exponencial con la suma de las intensidades, $\min(X_1, \dots, X_n) \sim \mathcal{E}(\lambda_1 + \dots + \lambda_n)$.'
    - 'Sólo el 36,8 % de los valores supera a la media, porque $P(X > 1/\lambda) = e^{-1} \approx 0{,}368$. La mediana, $\ln 2/\lambda$, es menor que la media.'

- id: gamma
  nombre: Gamma
  grupo: continua
  notacion: 'X \sim \Gamma(\nu, \lambda)'
  funcion: 'f_X(x) = \dfrac{\lambda^\nu}{\Gamma(\nu)} x^{\nu-1} e^{-\lambda x}'
  soporte: '[0, +\infty)'
  parametros: '\nu > 0,\ \lambda > 0'
  esperanza: '\nu/\lambda'
  varianza: '\nu/\lambda^2'
  modelo: 'Con $\nu$ entero, modela el tiempo hasta el $\nu$-ésimo evento de un proceso de Poisson de intensidad $\lambda$, que es la suma de $\nu$ exponenciales independientes.'
  supervivencia: 'S(t) = \sum_{n=0}^{k-1} \dfrac{e^{-\lambda t} (\lambda t)^n}{n!},\ t > 0 \ \ (\nu = k \in \mathbb{N})'
  nota: 'La función Gamma cumple $\Gamma(n) = (n-1)!$ para $n \in \mathbb{N}$, $\Gamma(t + 1) = t\,\Gamma(t)$ y $\Gamma(1/2) = \sqrt{\pi}$.'
  tips:
    - 'Con $\nu = k$ entero, es la suma de $k$ exponenciales independientes de intensidad $\lambda$, el tiempo hasta el $k$-ésimo evento de un proceso de Poisson. Es la versión continua de la Pascal.'
    - 'La relación con el proceso de Poisson da su función de supervivencia, $P(T > t) = P(N(t) \le k - 1)$, que es una suma de probabilidades de Poisson.'
    - '$\nu$ es el parámetro de forma y $\lambda$ el de escala inversa. Con $\nu = 1$ es la exponencial, y con $\nu = k/2$ y $\lambda = 1/2$, la $\chi^2_k$.'
    - 'Si $X \sim \Gamma(\nu_1, \lambda)$ e $Y \sim \Gamma(\nu_2, \lambda)$ son independientes, $X + Y \sim \Gamma(\nu_1 + \nu_2, \lambda)$.'

- id: normal
  nombre: Normal
  grupo: continua
  notacion: 'X \sim \mathcal{N}(\mu, \sigma^2)'
  funcion: 'f_X(x) = \dfrac{1}{\sqrt{2\pi}\,\sigma} e^{-\frac{(x-\mu)^2}{2\sigma^2}}'
  soporte: '\mathbb{R}'
  parametros: '\mu \in \mathbb{R},\ \sigma^2 > 0'
  esperanza: '\mu'
  varianza: '\sigma^2'
  modelo: 'Modela errores de medición y, por el teorema central del límite, sumas y promedios de muchas variables independientes.'
  tips:
    - 'El teorema central del límite explica su presencia en tantos fenómenos. La suma de muchas variables independientes con varianza finita, ninguna con demasiado peso, tiene distribución aproximadamente normal.'
    - 'La probabilidad de estar a menos de 1, 2 y 3 desvíos de la media es aproximadamente 0,683, 0,954 y 0,997, la regla 68-95-99,7.'
    - 'Toda combinación lineal de normales independientes es normal, y estandarizar con $Z = (X - \mu)/\sigma$ lleva cualquier normal a la $\mathcal{N}(0, 1)$ de la tabla.'
    - 'De Moivre la obtuvo como aproximación de la binomial, y Gauss la usó en la teoría de los errores de medición; por eso también se la llama gaussiana.'

- id: chi2
  nombre: Chi cuadrado
  grupo: continua
  notacion: 'X \sim \chi^2_k'
  funcion: 'f_X(x) = \dfrac{1}{2^{k/2}\,\Gamma(k/2)} x^{k/2-1} e^{-x/2}'
  soporte: '[0, +\infty)'
  parametros: 'k \in \mathbb{N}'
  esperanza: 'k'
  varianza: '2k'
  modelo: 'Es la distribución de la suma de los cuadrados de $k$ normales estándar independientes. En estadística, con datos normales, $(n-1)S^2/\sigma^2 \sim \chi^2_{n-1}$, y de ahí salen los intervalos y los tests de la varianza (guías 10 y 11).'
  equivalencias: ['\chi^2_k \equiv \Gamma(k/2, 1/2)']
  tips:
    - 'Es la suma de los cuadrados de $k$ normales estándar independientes. $k$ son los grados de libertad, y cada término agregado corre la distribución hacia la derecha.'
    - 'Es un caso particular de la Gamma, $\chi^2_k \equiv \Gamma(k/2, 1/2)$; con $k = 2$ es una exponencial de media 2.'
    - 'Es asimétrica a la derecha, y la asimetría disminuye al crecer $k$. Para $k$ grande se aproxima por $\mathcal{N}(k, 2k)$.'
    - 'La suma de $\chi^2$ independientes es $\chi^2$, con la suma de los grados de libertad.'

- id: t
  nombre: t de Student
  grupo: continua
  notacion: 'X \sim t_\nu'
  funcion: 'f_X(x) = \dfrac{\Gamma\!\left(\frac{\nu+1}{2}\right)}{\sqrt{\nu\pi}\,\Gamma\!\left(\frac{\nu}{2}\right)} \left(1 + \dfrac{x^2}{\nu}\right)^{-\frac{\nu+1}{2}}'
  soporte: '\mathbb{R}'
  parametros: '\nu > 0'
  esperanza: '0 \ \ (\nu > 1)'
  varianza: '\dfrac{\nu}{\nu - 2} \ \ (\nu > 2)'
  modelo: 'Aparece al estandarizar el promedio de datos normales con el desvío estimado; en estadística, en los intervalos y los tests de la media con varianza desconocida (guías 10 y 11). Con $\nu$ grande se parece a la normal estándar.'
  tips:
    - 'William Sealy Gosset la publicó en 1908 con el seudónimo «Student», porque la cervecería Guinness, donde trabajaba, no permitía que sus empleados publicaran con su nombre.'
    - 'Es $Z/\sqrt{V/\nu}$, con $Z \sim \mathcal{N}(0, 1)$ y $V \sim \chi^2_\nu$ independientes. Reemplazar $\sigma$ por su estimación $S$ agrega incertidumbre, que se refleja en colas más pesadas que las de la normal.'
    - 'Al crecer $\nu$ se acerca a la normal estándar. El cuantil 0,975 vale 12,706 con $\nu = 1$, 2,228 con $\nu = 10$ y 2,042 con $\nu = 30$, frente a 1,960 en la normal.'
    - 'Con $\nu = 1$ es la Cauchy, que no tiene esperanza. La esperanza existe para $\nu > 1$ y la varianza, para $\nu > 2$.'

- id: weibull
  nombre: Weibull
  grupo: continua
  notacion: 'X \sim \text{Wei}(c, \alpha)'
  funcion: 'f_X(x) = \dfrac{c}{\alpha}\left(\dfrac{x}{\alpha}\right)^{c-1} e^{-(x/\alpha)^c}'
  soporte: '[0, +\infty)'
  parametros: 'c > 0,\ \alpha > 0'
  esperanza: '\alpha\,\Gamma(1 + 1/c)'
  varianza: '\alpha^2\left[\Gamma(1 + 2/c) - \Gamma^2(1 + 1/c)\right]'
  modelo: 'Modela tiempos de vida y de falla. Según $c$, la tasa de falla crece ($c > 1$), es constante ($c = 1$, la exponencial) o decrece ($c < 1$).'
  supervivencia: 'S(t) = e^{-(t/\alpha)^c},\ t \ge 0'
  tips:
    - 'Es la distribución más usada en confiabilidad. La forma $c$ describe cómo envejece un componente. Con $c < 1$ la tasa de falla decrece (fallas tempranas), con $c = 1$ es constante (la exponencial) y con $c > 1$ crece (desgaste).'
    - 'Si $X \sim \mathcal{E}(1)$, entonces $\alpha X^{1/c} \sim \text{Wei}(c, \alpha)$. La Weibull es una potencia de una exponencial.'
    - 'Con $c = 2$ es una Rayleigh, $\text{Wei}(2, \alpha) \equiv \text{Ray}(\alpha/\sqrt{2})$.'
    - 'El mínimo de $n$ Weibull independientes con la misma forma $c$ y la misma escala $\alpha$ es Weibull, con escala $\alpha n^{-1/c}$. Por eso modela la resistencia de una cadena, que cede en su eslabón más débil.'

- id: rayleigh
  nombre: Rayleigh
  grupo: continua
  notacion: 'X \sim \text{Ray}(\sigma)'
  funcion: 'f_X(x) = \dfrac{x}{\sigma^2} e^{-x^2/(2\sigma^2)}'
  soporte: '[0, +\infty)'
  parametros: '\sigma > 0'
  esperanza: '\sigma\sqrt{\pi/2}'
  varianza: '\dfrac{4 - \pi}{2}\,\sigma^2'
  modelo: 'Es la distribución de la distancia al origen de un punto del plano cuyas coordenadas son normales independientes de media 0 y desvío $\sigma$.'
  supervivencia: 'S(t) = e^{-t^2/(2\sigma^2)},\ t \ge 0'
  tips:
    - 'Es la distancia al origen de un punto $(X, Y)$ con $X, Y \sim \mathcal{N}(0, \sigma^2)$ independientes, como el error de un disparo al blanco cuando los desvíos en cada eje son normales.'
    - 'Se usa para la altura de las olas, la velocidad del viento y la amplitud de señales con ruido.'
    - 'Es una Weibull de forma $c = 2$, y su cuadrado es exponencial, $X^2 \sim \mathcal{E}\big(1/(2\sigma^2)\big)$.'
    - 'Su moda es $\sigma$ y su media, $\sigma\sqrt{\pi/2} \approx 1{,}25\,\sigma$, queda un poco a la derecha por la cola larga.'

- id: pareto
  nombre: Pareto
  grupo: continua
  notacion: 'X \sim \text{Par}(m, \alpha)'
  funcion: 'f_X(x) = \dfrac{\alpha m^\alpha}{x^{\alpha+1}}'
  soporte: '[m, +\infty)'
  parametros: 'm > 0,\ \alpha > 0'
  esperanza: '\dfrac{\alpha m}{\alpha - 1} \ \ (\alpha > 1)'
  varianza: '\dfrac{m^2 \alpha}{(\alpha-1)^2(\alpha-2)} \ \ (\alpha > 2)'
  modelo: 'Modela magnitudes de cola pesada, en las que unos pocos valores muy grandes concentran buena parte del total, como los ingresos o los tamaños de archivos.'
  supervivencia: 'S(t) = (m/t)^\alpha,\ t \ge m'
  tips:
    - 'Describe magnitudes con unos pocos valores muy grandes, como ingresos, poblaciones de ciudades o tamaños de archivos. Vilfredo Pareto la propuso a fines del siglo XIX para la distribución de la riqueza.'
    - 'El principio del 80/20, según el cual el 20 % más rico concentra el 80 % de la riqueza, corresponde a una Pareto con $\alpha = \log_4 5 \approx 1{,}16$.'
    - 'Sus colas son tan pesadas que la esperanza existe sólo si $\alpha > 1$ y la varianza, sólo si $\alpha > 2$. Con $\alpha \le 1$, el promedio de una muestra crece sin límite al aumentar su tamaño.'
    - 'Condicionada a superar un valor $t \ge m$, sigue siendo Pareto, con mínimo $t$ y el mismo $\alpha$, $P(X > s \mid X > t) = (t/s)^\alpha$.'

- id: beta
  nombre: Beta
  grupo: continua
  notacion: 'X \sim \beta(a, b)'
  funcion: 'f_X(x) = \dfrac{\Gamma(a+b)}{\Gamma(a)\,\Gamma(b)} x^{a-1}(1-x)^{b-1}'
  soporte: '(0, 1)'
  parametros: 'a > 0,\ b > 0'
  esperanza: 'a/(a+b)'
  varianza: '\dfrac{ab}{(a+b)^2(a+b+1)}'
  modelo: 'Modela proporciones y probabilidades, con valores en $(0, 1)$. En la estimación bayesiana es la distribución a priori habitual de una probabilidad (guía 12).'
  equivalencias: ['\beta(1, 1) \equiv \mathcal{U}(0, 1)']
  tips:
    - 'Es la distribución natural para una probabilidad o una proporción desconocida, porque toma valores en $(0, 1)$ y su forma se ajusta con dos parámetros. Con $a = b$ es simétrica, con $a > b$ se carga hacia 1 y con $a < b$, hacia 0.'
    - 'Con $a = b = 1$ es la uniforme; con $a < 1$ y $b < 1$ tiene forma de U y se acumula en los extremos.'
    - 'Si la a priori de $p$ es $\beta(a, b)$ y se observan $x$ éxitos en $n$ ensayos de Bernoulli, la a posteriori es $\beta(a + x, b + n - x)$. Los parámetros funcionan como éxitos y fracasos ya observados.'
    - 'El $k$-ésimo menor de $n$ uniformes independientes en $(0, 1)$ tiene distribución $\beta(k, n - k + 1)$.'

- id: cauchy
  nombre: Cauchy
  grupo: continua
  notacion: 'X \sim \text{Cau}(x_0, \gamma)'
  funcion: 'f_X(x) = \dfrac{1}{\pi\gamma}\left[\dfrac{\gamma^2}{(x - x_0)^2 + \gamma^2}\right]'
  soporte: '\mathbb{R}'
  parametros: 'x_0 \in \mathbb{R},\ \gamma > 0'
  esperanza: '\text{no existe}'
  varianza: '\text{no existe}'
  modelo: 'Es la distribución del cociente de dos normales estándar independientes. Sus colas son tan pesadas que no tiene esperanza ni varianza.'
  tips:
    - 'Es el cociente de dos normales estándar independientes, y también la $t$ de Student con un grado de libertad.'
    - 'No tiene esperanza. El promedio de $n$ variables Cauchy independientes vuelve a tener la misma distribución, de modo que promediar no reduce la dispersión y la ley de los grandes números no se aplica.'
    - 'Si $\Theta \sim \mathcal{U}(-\pi/2, \pi/2)$, $x_0 + \gamma \tan\Theta \sim \text{Cau}(x_0, \gamma)$. Es la posición donde pega en una pared un haz que sale de un punto con un ángulo al azar; en física, la forma de las líneas espectrales.'
    - 'Su mediana y su moda valen $x_0$, y el rango intercuartílico es $2\gamma$. Esas medidas reemplazan a la media y al desvío.'

- id: multinomial
  nombre: Multinomial
  grupo: multivariada
  notacion: '\mathbf{X} \sim \mathcal{M}(n, p_1, \dots, p_k)'
  funcion: 'p_{\mathbf{X}}(x_1, \dots, x_k) = \dfrac{n!}{x_1! \cdots x_k!}\, p_1^{x_1} \cdots p_k^{x_k}'
  soporte: 'x_i \in \{0, \dots, n\},\ \sum_i x_i = n'
  parametros: '0 < p_i < 1,\ \sum_i p_i = 1,\ n \in \mathbb{N}'
  esperanza: 'E[X_i] = np_i'
  varianza: '\operatorname{var}(X_i) = np_i(1-p_i),\ \operatorname{cov}(X_i, X_j) = -np_ip_j'
  modelo: 'Modela la cantidad de observaciones de cada resultado posible al repetir $n$ veces, de forma independiente, un experimento con $k$ resultados de probabilidades $p_1, \dots, p_k$. Cada componente es binomial, $X_i \sim \mathcal{B}(n, p_i)$.'
  propiedades:
    - 'X_i \sim \mathcal{B}(n, p_i)'
    - '(X_2, \dots, X_k) \mid X_1 = x_1 \sim \mathcal{M}\left(n - x_1, \dfrac{p_2}{1-p_1}, \dots, \dfrac{p_k}{1-p_1}\right)'
  tips:
    - 'Generaliza la binomial a más de dos resultados. Con $k = 2$ se reduce a una binomial, porque $X_2 = n - X_1$ queda determinada por $X_1$.'
    - 'Las componentes no son independientes. Como suman $n$, cuando una crece las otras tienden a bajar, y por eso $\operatorname{cov}(X_i, X_j) = -np_ip_j < 0$.'
    - 'Agrupar resultados conserva el modelo. Cada componente es binomial, y también la suma de varias, por ejemplo $X_1 + X_2 \sim \mathcal{B}(n, p_1 + p_2)$.'
    - 'Modela, por ejemplo, la cantidad de veces que sale cada cara en $n$ tiradas de un dado, o los votos de cada candidato en una muestra con reposición.'

- id: normal-bivariada
  nombre: Normal bivariada
  grupo: multivariada
  notacion: '(X_1, X_2) \sim \mathcal{N}_2(\mu_1, \mu_2, \sigma_1^2, \sigma_2^2, \rho)'
  funcion: 'f(x_1, x_2) = \dfrac{1}{2\pi\sigma_1\sigma_2\sqrt{1-\rho^2}} \exp\!\left(-\dfrac{z_1^2 - 2\rho z_1 z_2 + z_2^2}{2(1-\rho^2)}\right),\ z_i = \dfrac{x_i - \mu_i}{\sigma_i}'
  soporte: '\mathbb{R}^2'
  parametros: '\mu_i \in \mathbb{R},\ \sigma_i^2 > 0,\ -1 < \rho < 1'
  esperanza: 'E[X_i] = \mu_i'
  varianza: '\operatorname{var}(X_i) = \sigma_i^2,\ \operatorname{cov}(X_1, X_2) = \rho\sigma_1\sigma_2'
  modelo: 'Modela dos variables normales correlacionadas. Las marginales son normales, y también las condicionales, $X_2 \mid X_1 = x_1 \sim \mathcal{N}\big(\mu_2 + \rho\sigma_2 \frac{x_1 - \mu_1}{\sigma_1},\ (1-\rho^2)\sigma_2^2\big)$.'
  propiedades:
    - 'X_1 \sim \mathcal{N}(\mu_1, \sigma_1^2),\quad X_2 \sim \mathcal{N}(\mu_2, \sigma_2^2)'
    - 'X_1 \mid X_2 = x_2 \sim \mathcal{N}\left(\mu_1 + \rho\sigma_1 \dfrac{x_2 - \mu_2}{\sigma_2},\ (1-\rho^2)\sigma_1^2\right)'
    - 'X_2 \mid X_1 = x_1 \sim \mathcal{N}\left(\mu_2 + \rho\sigma_2 \dfrac{x_1 - \mu_1}{\sigma_1},\ (1-\rho^2)\sigma_2^2\right)'
    - '\boldsymbol{\mu} = \begin{pmatrix} \mu_1 \\ \mu_2 \end{pmatrix},\quad \Sigma = \begin{pmatrix} \sigma_1^2 & \rho\sigma_1\sigma_2 \\ \rho\sigma_1\sigma_2 & \sigma_2^2 \end{pmatrix}'
  tips:
    - 'Las curvas de nivel de la densidad son elipses centradas en $(\mu_1, \mu_2)$. Con $\rho > 0$ se inclinan en el sentido de la diagonal, con $\rho < 0$ en el contrario, y con $\rho = 0$ sus ejes son paralelos a los de coordenadas.'
    - 'En la normal bivariada, covarianza nula equivale a independencia. En general, $\operatorname{cov}(X, Y) = 0$ no implica independencia.'
    - 'La esperanza condicional $E[X_2 \mid X_1 = x_1]$ es una recta en $x_1$, la recta de regresión, y la varianza condicional $(1 - \rho^2)\sigma_2^2$ no depende de $x_1$.'
    - 'Que las dos marginales sean normales no alcanza para que el vector sea normal bivariado. Hace falta que toda combinación lineal $aX_1 + bX_2$ sea normal.'
    - 'Galton la encontró en 1886 al estudiar la estatura de padres e hijos. Los hijos de padres muy altos tienden a ser altos, pero menos que sus padres, porque $|\rho| < 1$; de ahí el nombre de regresión a la media.'
