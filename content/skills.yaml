# Catálogo único de skills (PLAN.md §4.2).
#
# Un skill puede evaluarse en varias guías; `guia` es donde se introduce.
# Las fórmulas son LaTeX sin delimitadores y se muestran en el panel de
# fórmulas de cada ítem que declara el skill.

- id: algebras
  nombre: Álgebras de eventos
  guia: 1
  descripcion: >-
    Reconocer y construir la menor álgebra que contiene ciertos eventos:
    cerrar por complemento y unión.
  formulas:
    - '\Omega \in \mathcal{A}'
    - 'A \in \mathcal{A} \implies A^c \in \mathcal{A}'
    - 'A, B \in \mathcal{A} \implies A \cup B \in \mathcal{A}'

- id: prob-discreta
  nombre: Probabilidad en espacios discretos
  guia: 1
  descripcion: >-
    Asignar una probabilidad por pesos sobre los puntos de Ω y calcular la de
    un evento sumando los pesos que contiene.
  formulas:
    - 'P(A) = \sum_{\omega \in A} p(\omega)'
    - '\sum_{\omega \in \Omega} p(\omega) = 1'

- id: laplace
  nombre: Conteo y regla de Laplace
  guia: 1
  descripcion: >-
    Contar casos favorables sobre casos totales en un espacio equiprobable,
    con y sin orden, con y sin reposición.
  formulas:
    - 'P(A) = \dfrac{\#A}{\#\Omega}'
    - '\binom{n}{k} = \dfrac{n!}{k!\,(n-k)!}'

- id: inclusion-exclusion
  nombre: Unión, complemento e inclusión-exclusión
  guia: 1
  descripcion: >-
    Calcular la probabilidad de una unión descontando las intersecciones, y
    pasar al complemento cuando conviene.
  formulas:
    - 'P(A \cup B) = P(A) + P(B) - P(A \cap B)'
    - 'P(A \cup B \cup C) = P(A) + P(B) + P(C) - P(AB) - P(AC) - P(BC) + P(ABC)'
    - 'P(A^c) = 1 - P(A)'

- id: independencia
  nombre: Independencia
  guia: 1
  descripcion: >-
    Multiplicar probabilidades cuando los eventos no se influyen, y reconocer
    cuándo eso vale.
  formulas:
    - 'P(A \cap B) = P(A)\,P(B)'
    - 'P\!\left(\bigcap_{i=1}^{n} A_i\right) = \prod_{i=1}^{n} P(A_i)'

- id: continuidad-P
  nombre: Continuidad de P
  guia: 1
  descripcion: >-
    Pasar al límite en una sucesión monótona de eventos para calcular la
    probabilidad de la intersección o la unión de todos.
  formulas:
    - 'B_{n+1} \subset B_n \implies P\!\left(\bigcap_{n \ge 1} B_n\right) = \lim_{n \to \infty} P(B_n)'
    - 'A_n \subset A_{n+1} \implies P\!\left(\bigcup_{n \ge 1} A_n\right) = \lim_{n \to \infty} P(A_n)'

- id: conteo-muestras
  nombre: Muestras con y sin reposición
  guia: 1
  descripcion: >-
    Elegir el espacio muestral según si importa el orden y si hay reposición,
    que es lo que define cuántos casos equiprobables hay.
  formulas:
    - '\text{con orden, con reposición: } n^k'
    - '\text{con orden, sin reposición: } \dfrac{n!}{(n-k)!}'
    - '\text{sin orden, sin reposición: } \binom{n}{k}'

- id: ocupacion
  nombre: Problemas de ocupación
  guia: 1
  descripcion: >-
    Repartir objetos en cajas. Lo que cambia todo es si los objetos son
    distinguibles o no, porque cambia cuáles son los casos equiprobables.
  formulas:
    - '\text{distinguibles en } r \text{ cajas: } r^n'
    - '\text{indistinguibles: } \binom{n + r - 1}{r - 1}'
    - '\text{reparto }(n_1,\dots,n_r)\text{ de objetos distinguibles: } \dfrac{n!}{n_1!\cdots n_r!}'

- id: prob-geometrica
  nombre: Probabilidad geométrica
  guia: 1
  descripcion: >-
    Cuando el espacio muestral es un intervalo o una región, la probabilidad
    es la medida del evento sobre la medida del total.
  formulas:
    - 'P(A) = \dfrac{\text{medida}(A)}{\text{medida}(\Omega)}'

- id: condicional
  nombre: Probabilidad condicional
  guia: 1
  descripcion: >-
    Recalcular una probabilidad cuando se sabe que ocurrió otro evento:
    restringir el espacio y renormalizar.
  formulas:
    - 'P(A \mid B) = \dfrac{P(A \cap B)}{P(B)}, \quad P(B) > 0'
    - 'P(A \cap B) = P(B)\,P(A \mid B)'

- id: prob-total
  nombre: Probabilidad total
  guia: 1
  descripcion: >-
    Descomponer un evento según una partición y sumar los caminos que llevan
    a él.
  formulas:
    - 'P(A) = \sum_i P(A \mid B_i)\,P(B_i)'

- id: bayes
  nombre: Regla de Bayes
  guia: 1
  descripcion: >-
    Invertir un condicional: pasar de P(efecto | causa) a P(causa | efecto).
  formulas:
    - 'P(B_j \mid A) = \dfrac{P(A \mid B_j)\,P(B_j)}{\sum_i P(A \mid B_i)\,P(B_i)}'

# --- guía 2 -----------------------------------------------------------

- id: variable-aleatoria
  nombre: Variable aleatoria y medibilidad
  guia: 2
  descripcion: >-
    Reconocer cuándo una función de Ω en los reales es variable aleatoria:
    que sus preimágenes pertenezcan al álgebra.
  formulas:
    - '\{\omega : X(\omega) \le t\} \in \mathcal{A} \quad \forall t \in \mathbb{R}'

- id: funcion-distribucion
  nombre: Función de distribución
  guia: 2
  descripcion: >-
    Leer y usar $F_X(x) = P(X \le x)$: dónde concentra masa, cómo salen las
    probabilidades de intervalos abiertos y cerrados.
  formulas:
    - 'F_X(x) = P(X \le x)'
    - 'P(a < X \le b) = F_X(b) - F_X(a)'
    - 'P(X = a) = F_X(a) - F_X(a^-)'
    - 'P(X > a) = 1 - F_X(a)'

- id: densidad
  nombre: Densidad de una variable continua
  guia: 2
  descripcion: >-
    Integrar una densidad para obtener probabilidades, y usar que integra 1
    como control.
  formulas:
    - 'P(a < X < b) = \int_a^b f_X(x)\,dx'
    - '\int_{-\infty}^{\infty} f_X(x)\,dx = 1'
    - 'F_X(x) = \int_{-\infty}^{x} f_X(u)\,du'

- id: truncamiento
  nombre: Condicionamiento a un evento
  guia: 2
  descripcion: >-
    La distribución de una variable restringida a un evento: quedarse con el
    pedazo y renormalizar.
  formulas:
    - 'f_{X \mid A}(x) = \dfrac{f_X(x)\,\mathbf{1}\{x \in A\}}{P(A)}'
    - 'F_{X \mid A}(x) = \dfrac{P(X \le x,\ A)}{P(A)}'

- id: conjunta-marginales
  nombre: Conjunta y marginales
  guia: 2
  descripcion: >-
    Pasar de la densidad conjunta de un vector a las marginales de cada
    coordenada, integrando sobre la otra.
  formulas:
    - 'f_X(x) = \int_{-\infty}^{\infty} f_{(X,Y)}(x, y)\,dy'
    - 'f_Y(y) = \int_{-\infty}^{\infty} f_{(X,Y)}(x, y)\,dx'
    - 'P((X,Y) \in A) = \iint_A f_{(X,Y)}(x, y)\,dx\,dy'

- id: independencia-va
  nombre: Independencia de variables aleatorias
  guia: 2
  descripcion: >-
    Reconocer independencia por la factorización de la conjunta, y el soporte
    rectangular como condición necesaria.
  formulas:
    - 'f_{(X,Y)}(x, y) = f_X(x)\,f_Y(y)'
    - 'F_{(X,Y)}(x, y) = F_X(x)\,F_Y(y)'
