# Publica la app en GitHub Pages en cada push a main.
#
# Sólo se sube dist/, así que los PDF de fuentes/ nunca se publican.
# El checkout además excluye fuentes/ a propósito: son 300 MB que el build
# no necesita y que harían lento cada corrida.
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  # Permite lanzarlo a mano desde la pestaña Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se pushea dos veces seguidas, se cancela el deploy viejo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # El build no usa fuentes/; sacarlas del checkout ahorra ~300 MB.
          sparse-checkout: |
            /*
            !/fuentes
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          # Node 24: los scripts de tools/ son .ts y se corren sin compilar.
          node-version: '24'
          cache: npm

      - run: npm ci

      # Corre el validador de contenido, el smoke del motor y el render-check
      # antes de construir. Si el contenido está mal, no se publica.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
